<!DOCTYPE html>
<html lang="ko" data-fc-theme="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBS — 간트 기반 프로젝트 관리</title>
<meta name="description" content="다수 참여 프로젝트를 위한 간트 차트 기반 WBS 관리. Level 1~4 업무 분해, 담당자·산출물·상태·일정 컬럼과 간트 차트를 한 화면에서.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%230a84ff'/%3E%3Ctext x='50' y='68' font-family='Manrope,sans-serif' font-size='44' font-weight='800' text-anchor='middle' fill='white'%3EWBS%3C/text%3E%3C/svg%3E">
<style>
  /* ===== fc-ui Glass theme =====
     Tokens mirror @fcstudio/fc-ui's THEMES.glass (see fc-ui/src/core/themes.js).
     Translucent frosted surfaces over a soft pastel bloom background.
  */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    /* Explicit palette per user spec — black canvas, bright text, light-grey table lines. */
    --fc-bg:       #000000;                /* canvas — pure black */
    --fc-surface:  #0a0a0a;                /* surface-1: topbar, toolbar, panels */
    --fc-elev:     #141414;                /* surface-2: lifted cards, hovered surfaces */
    --fc-surface-3:#1a1a1a;                /* surface-3: nested panels */
    --fc-surface-4:#202020;                /* surface-4: deepest lift */
    --fc-ink:      #ffffff;                /* primary text — bright white */
    --fc-ink-2:    #e6e6e6;                /* secondary text */
    --fc-ink-3:    #c0c0c0;                /* tertiary text — column headers, labels */
    --fc-ink-4:    #8a8a8a;                /* quaternary — placeholders, footnotes */
    --fc-accent:   #5e6ad2;                /* Linear lavender-blue (saturated, for fills) */
    --fc-accent-2: rgba(94,106,210,0.22);  /* accent tint for fills */
    --fc-accent-hover: #828fff;
    --fc-accent-focus: #5e69d1;
    --fc-accent-text: #b5beff;             /* brighter lavender for text on dark / on accent-tinted bg */
    --fc-line:     #3a3a3a;                /* hairline border on cards/dividers — light grey */
    --fc-line-2:   #555555;                /* hairline-strong — input focus, emphasis */
    --fc-line-ink: #404040;                /* table cell separators — light grey per spec */
    --fc-success: #27a644; --fc-success-2: rgba(39,166,68,0.22);
    --fc-warn:    #d18b2a; --fc-warn-2:    rgba(209,139,42,0.22);
    --fc-danger:  #e5484d; --fc-danger-2:  rgba(229,72,77,0.20);
    --fc-purple:  #a48aff;
    --fc-orange:  #d18b2a;
    --fc-font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    --fc-font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text',    system-ui, sans-serif;
    --fc-font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --fc-r-sm: 6px; --fc-r-md: 8px; --fc-r-lg: 12px; --fc-r-pill: 999px;
    --fc-shadow-card: 0 0 0 1px var(--fc-line), 0 1px 2px 0 rgba(0,0,0,0.4);
    --fc-shadow-pop:  0 0 0 1px var(--fc-line-2), 0 16px 32px -8px rgba(0,0,0,0.6);

    /* layout */
    --topbar-h: 56px;
    --row-h: 36px;
    --day-w: 18px;
    /* Column widths — independent per column so each can be resized via the header
       handle. Persisted in localStorage under WBS_COLWIDTHS_KEY. */
    --col-name-w: 320px;
    --col-rfp-w: 96px;
    --col-assignee-w: 108px;
    --col-deliv-w: 144px;
    --col-status-w: 116px;
    --col-progress-w: 96px;
    --col-start-w: 124px;
    --col-end-w: 124px;
    /* Live grid track list for .grid-row — rebuilt by applyGridColumns() from the
       set of *visible* columns (RESIZABLE_COLUMNS minus hidden/deleted) so hiding or
       deleting a column collapses its track instead of leaving a gap. The default here
       lists all 8 data columns + Gantt so the very first paint (before JS runs) is
       correct. */
    --grid-cols:
      var(--col-name-w) var(--col-rfp-w) var(--col-assignee-w) var(--col-deliv-w)
      var(--col-status-w) var(--col-progress-w) var(--col-start-w) var(--col-end-w)
      var(--gantt-w, 1fr);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--fc-bg);
    background-attachment: fixed;
    color: var(--fc-ink);
    font-family: var(--fc-font-body);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
    /* Tell the UA the page is dark so native controls (date picker, scrollbar,
       option dropdown, form widgets) render with their dark theme. */
    color-scheme: dark;
  }

  /* Surface mixin — sits on the canvas with only a hairline border for separation.
     Uses --fc-bg (not --fc-surface) so the big topbar / main panels blend with the
     true canvas instead of reading as a separate grey layer. Cards (.report-card,
     .modal-card, etc.) still use --fc-surface explicitly for slight elevation. */
  [data-fc-glass] {
    background: var(--fc-bg);
    border: 1px solid var(--fc-line);
    box-shadow: var(--fc-shadow-card);
  }

  /* ───── Top bar ───── */
  .topbar {
    height: var(--topbar-h);
    margin: 12px 16px 6px;
    border-radius: var(--fc-r-lg);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 14px;
    position: relative;
    z-index: 10;
  }
  .logo {
    font-family: var(--fc-font-display);
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.022em;
    color: var(--fc-ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot {
    width: 22px; height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background: linear-gradient(135deg, #0a84ff, #bf5af2);
    color: #fff;
    font-size: 11px;
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.04), 0 2px 6px rgba(94,106,210,0.48);
  }
  .project-name {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--fc-line);
    color: var(--fc-ink);
    font-size: 14px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: var(--fc-r-sm);
    transition: background .15s, border-color .15s;
    min-width: 200px;
    font-family: var(--fc-font-body);
  }
  .project-name:hover { background: rgba(255,255,255,0.06); }
  .project-name:focus {
    border-color: var(--fc-accent);
    background: rgba(255,255,255,0.08);
    outline: none;
    box-shadow: 0 0 0 3px var(--fc-accent-2);
  }
  .spacer { flex: 1; }
  .save-status {
    font-size: 11px;
    color: var(--fc-ink-3);
    font-family: var(--fc-font-mono);
  }
  .top-btn {
    padding: 7px 14px;
    border-radius: var(--fc-r-sm);
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border: 1px solid var(--fc-line);
    color: var(--fc-ink-2);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--fc-font-body);
    transition: all .15s;
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.04);
    letter-spacing: -0.01em;
  }
  .top-btn:hover {
    background: rgba(255,255,255,0.07);
    color: var(--fc-ink);
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.06), 0 4px 12px rgba(0,0,0,0.4);
  }
  .top-btn.primary {
    background: var(--fc-accent);
    border-color: rgba(94,106,210,0.65);
    color: #fff;
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.02), 0 2px 8px rgba(94,106,210,0.48);
  }
  .top-btn.primary:hover {
    background: #1c8eff;
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.03), 0 4px 14px rgba(94,106,210,0.6);
  }

  /* ───── Main ───── */
  .main {
    height: calc(100vh - var(--topbar-h) - 18px);
    display: flex;
    flex-direction: column;
    margin: 6px 16px 16px;
    border-radius: var(--fc-r-lg);
    overflow: hidden;
  }
  /* .main inherits the surface mixin from [data-fc-glass]; no override needed.
     (Previous fc-ui glass theme used a translucent white wash here — that's now removed
     so the main panel reads as the true canvas color.) */

  .toolbar {
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    font-size: 11px;
    color: var(--fc-ink-3);
    border-bottom: 1px solid var(--fc-line-ink);
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }
  .toolbar .stat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: var(--fc-r-pill);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--fc-line);
    font-family: var(--fc-font-mono);
    color: var(--fc-ink-2);
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.04);
  }
  .toolbar .stat .v { color: var(--fc-ink); font-weight: 700; }

  /* Status filter buttons (완료/진행중/지연) — clickable .stat variants.
     Same shape as a passive stat but with hover affordance and a saturated active
     state when the user has toggled that status as the row filter. */
  .toolbar button.stat {
    cursor: pointer;
    font-family: var(--fc-font-mono);
    font-size: 11px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .toolbar button.stat:hover { background: var(--fc-elev); border-color: var(--fc-line-2); color: var(--fc-ink); }
  .toolbar button.stat.active {
    background: rgba(94,106,210,0.22);
    border-color: rgba(94,106,210,0.55);
    color: var(--fc-ink);
  }
  .toolbar button.stat.active .v { color: var(--fc-accent-text); }
  .toolbar button.stat[data-status-filter="delayed"].active {
    background: rgba(229,72,77,0.20);
    border-color: rgba(229,72,77,0.5);
  }
  .toolbar button.stat[data-status-filter="delayed"].active .v { color: var(--fc-danger); }
  .toolbar .assignee-filter {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
    background: rgba(255,255,255,0.04);
    border-radius: var(--fc-r-pill);
    border: 1px solid var(--fc-line);
    padding: 0 4px 0 10px;
    min-width: 200px;
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.04);
    transition: border-color .15s, box-shadow .15s;
  }
  .toolbar .assignee-filter .icon {
    font-size: 11px;
    color: var(--fc-ink-3);
    display: inline-flex;
    align-items: center;
  }
  .toolbar .assignee-filter input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    padding: 5px 0;
    font-size: 12px;
    font-family: var(--fc-font-body);
    color: var(--fc-ink);
    outline: none;
  }
  .toolbar .assignee-filter input::placeholder { color: var(--fc-ink-3); }
  .toolbar .assignee-filter .count {
    font-family: var(--fc-font-mono);
    font-size: 10px;
    color: var(--fc-ink-3);
    padding: 0 2px;
    white-space: nowrap;
  }
  .toolbar .assignee-filter button {
    width: 18px; height: 18px;
    border: 0; background: transparent; cursor: pointer;
    color: var(--fc-ink-3);
    font-size: 14px;
    line-height: 1;
    border-radius: 50%;
    visibility: hidden;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .toolbar .assignee-filter button:hover { background: rgba(255,255,255,0.06); color: var(--fc-ink); }
  .toolbar .assignee-filter.has-value button { visibility: visible; }
  .toolbar .assignee-filter.has-value .icon { color: var(--fc-accent-text); }
  .toolbar .assignee-filter:focus-within {
    border-color: var(--fc-accent);
    box-shadow: 0 0 0 3px var(--fc-accent-2);
  }

  .empty-filter {
    padding: 36px 16px;
    text-align: center;
    color: var(--fc-ink-3);
    font-size: 12.5px;
  }

  .toolbar .zoom {
    display: flex;
    gap: 4px;
    margin-left: auto;
    padding: 3px;
    background: rgba(255,255,255,0.03);
    border-radius: var(--fc-r-pill);
    border: 1px solid var(--fc-line);
  }
  .toolbar .zoom button {
    padding: 3px 11px;
    background: transparent;
    border: none;
    color: var(--fc-ink-2);
    border-radius: var(--fc-r-pill);
    cursor: pointer;
    font-size: 11px;
    font-family: var(--fc-font-mono);
    font-weight: 600;
    transition: all .15s;
  }
  .toolbar .zoom button:hover { background: rgba(255,255,255,0.04); }
  .toolbar .zoom button.active {
    background: var(--fc-accent);
    color: #fff;
    box-shadow: 0 2px 6px rgba(94,106,210,0.48);
  }

  /* ───── Wbs/Gantt split ───── */
  .wbs {
    flex: 1;
    overflow: auto;
    position: relative;
  }
  .grid-row {
    display: grid;
    grid-template-columns: var(--grid-cols);   /* track list (incl. Gantt) is built in JS
                                so hidden/deleted columns collapse cleanly and the timeline
                                can be wider than the viewport with horizontal scroll. */
    /* Size the row's bounding box to the full grid track sum (not just .wbs's width).
       Without this, position:sticky cells get pushed off-screen near max horizontal
       scroll because their containing block stops at the row's narrower bbox. */
    width: max-content;
    min-width: 100%;
    border-bottom: 1px solid var(--fc-line-ink);
    min-height: var(--row-h);
  }

  /* Sticky header */
  .header-row {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--fc-line-ink);
    font-size: 10px;
    color: var(--fc-ink-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
  }
  .header-row .cell {
    padding: 10px 12px;
    border-right: 1px solid var(--fc-line-ink);
    display: flex;
    align-items: center;
  }
  .header-row .gantt-axis-cell { padding: 0; }
  .header-row .cell { position: relative; }

  /* Column resize handle — sits on the right border of each header cell. 4px wide
     hit area that widens visually on hover. The Gantt column doesn't get one. */
  .col-resize {
    position: absolute;
    top: 0; bottom: 0;
    right: -2px;
    width: 6px;
    cursor: ew-resize;
    z-index: 6;
    user-select: none;
  }
  .col-resize::after {
    content: "";
    position: absolute;
    top: 6px; bottom: 6px;
    left: 2px;
    width: 2px;
    background: transparent;
    border-radius: 2px;
    transition: background .15s;
  }
  .col-resize:hover::after { background: var(--fc-accent); }
  body[data-col-resizing] { cursor: ew-resize; user-select: none; }
  body[data-col-resizing] .col-resize::after { background: var(--fc-accent); }

  /* Row selection — click a task row to select it, Shift+click to toggle into a multi-set.
     Temporary visual tint; cleared by clicking the same single-selected row. */
  .task-row.row-selected,
  .task-row.row-selected:hover,
  .task-row.level-1.row-selected,
  .task-row.level-1.row-selected:hover {
    background: rgba(10, 132, 255, 0.16);
    box-shadow: inset 3px 0 0 0 var(--fc-accent);
  }

  /* Column selection — click a header to pin its column to the left of horizontal scroll,
     Shift+click to pin multiple. Pinned cells use near-opaque backgrounds so gantt bars
     and grid content scrolling underneath don't bleed through. */
  .header-row .cell[data-col-key] { cursor: pointer; user-select: none; }
  .cell.col-pinned {
    position: sticky;
    z-index: 3;
    /* Lifted "frozen panel" — clearly brighter and more lavender-tinted than the new
       dark-grey canvas/surface so pinned columns read as elevated. MUST be opaque so
       bars scrolling underneath don't bleed through. Brighter inner hairlines
       (border-right / border-bottom) restore the grid separator visibility that would
       otherwise vanish into the same-luminance default --fc-line-ink color. */
    background: #2a3149;
    border-right-color: rgba(255,255,255,0.08);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .task-row:hover .cell.col-pinned          { background: #323b58; }
  .task-row.level-1 .cell.col-pinned        { background: #2f3650; }
  .task-row.level-1:hover .cell.col-pinned  { background: #384062; }
  .task-row.row-selected .cell.col-pinned,
  .task-row.row-selected:hover .cell.col-pinned { background: #3f4878; }
  .header-row .cell.col-pinned {
    background: #323a58;
    color: #c8cffd;  /* brighter lavender so the header label pops against the wash */
    z-index: 2;  /* relative to .header-row's own z-index 5 — keeps pinned header above peers */
  }

  /* Per-column sticky-left offsets — values are set as CSS vars on :root by
     recomputeStickyOffsets() based on the current pinned set + each column's width. */
  .cell[data-col-key="name"].col-pinned     { left: var(--sticky-left-name, 0px); }
  .cell[data-col-key="rfp"].col-pinned      { left: var(--sticky-left-rfp, 0px); }
  .cell[data-col-key="assignee"].col-pinned { left: var(--sticky-left-assignee, 0px); }
  .cell[data-col-key="deliv"].col-pinned    { left: var(--sticky-left-deliv, 0px); }
  .cell[data-col-key="status"].col-pinned   { left: var(--sticky-left-status, 0px); }
  .cell[data-col-key="progress"].col-pinned { left: var(--sticky-left-progress, 0px); }
  .cell[data-col-key="start"].col-pinned    { left: var(--sticky-left-start, 0px); }
  .cell[data-col-key="end"].col-pinned      { left: var(--sticky-left-end, 0px); }

  /* Column header context menu — opened by right-clicking a column header. Floating
     panel positioned at the cursor by openColumnMenu(); a single flat list holds
     숨김 / 삭제 plus an inline "숨김 해제" section listing currently-hidden columns. */
  .col-menu {
    position: fixed;
    z-index: 1000;
    min-width: 200px;
    max-width: 280px;
    padding: 5px;
    background: var(--fc-surface-3);
    border: 1px solid var(--fc-line-2);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    font-size: 12.5px;
    color: var(--fc-ink-2);
    user-select: none;
  }
  .col-menu-title {
    padding: 6px 10px 7px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fc-ink-4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .col-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .col-menu-item:hover:not(:disabled),
  .col-menu-item:focus-visible:not(:disabled) {
    background: var(--fc-accent);
    color: #fff;
    outline: none;
  }
  .col-menu-item:disabled { opacity: 0.38; cursor: default; }
  .col-menu-item.danger:hover:not(:disabled) { background: var(--fc-danger); }
  .col-menu-item .mi-ico { width: 14px; text-align: center; flex: 0 0 auto; opacity: 0.85; }
  .col-menu-sep { height: 1px; margin: 5px 6px; background: var(--fc-line); }
  .col-menu-label {
    padding: 5px 10px 3px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fc-ink-4);
  }

  /* Undo/redo toolbar buttons share .top-btn styling; just disable affordance. */
  .top-btn:disabled { opacity: 0.35; cursor: default; }
  .top-btn.icon-btn { padding: 7px 10px; font-size: 14px; line-height: 1; }

  /* Body rows */
  .task-row { background: transparent; transition: background .12s; }
  .task-row:hover { background: rgba(255,255,255,0.04); }
  .task-row.level-1 {
    background: rgba(94,106,210,0.10);
    font-weight: 600;
  }
  .task-row.level-1:hover { background: rgba(94,106,210,0.18); }

  .cell {
    padding: 0 10px;
    border-right: 1px solid var(--fc-line-ink);
    display: flex;
    align-items: center;
    min-height: var(--row-h);
    overflow: hidden;
  }
  .cell.name-cell { gap: 6px; }

  .toggle {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--fc-ink-3);
    cursor: pointer;
    border-radius: 5px;
    flex-shrink: 0;
    transition: all .12s;
  }
  .toggle:hover { color: var(--fc-ink); background: rgba(255,255,255,0.04); }
  .toggle.leaf { visibility: hidden; }

  .lv-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--fc-font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--fc-ink-3);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--fc-line);
    border-radius: 6px;
    padding: 2px 6px;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .lv-1 { color: var(--fc-accent-text);  background: rgba(94,106,210,0.22);  border-color: rgba(94,106,210,0.48); }
  .lv-2 { color: var(--fc-success); background: rgba(48,209,88,0.12);   border-color: rgba(48,209,88,0.35); }
  .lv-3 { color: var(--fc-purple);  background: rgba(191,90,242,0.12);  border-color: rgba(191,90,242,0.35); }
  .lv-4 { color: var(--fc-orange);  background: rgba(255,159,10,0.12);  border-color: rgba(255,159,10,0.35); }

  /* Delay badge — small pill next to the task name. Red for past-deadline (overdue),
     orange for late-start (start date passed but not yet started). Tooltip carries detail. */
  .delay-badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border-radius: var(--fc-r-pill);
    font-size: 9.5px;
    font-weight: 700;
    font-family: var(--fc-font-mono);
    flex-shrink: 0;
    cursor: help;
    letter-spacing: 0.02em;
  }
  .delay-badge.overdue {
    background: rgba(255,69,58,0.16);
    border: 1px solid rgba(255,69,58,0.4);
    color: var(--fc-danger);
  }
  .delay-badge.late-start {
    background: rgba(255,159,10,0.16);
    border: 1px solid rgba(255,159,10,0.4);
    color: var(--fc-warn);
  }
  /* Overdue gantt bar gets a thin red outline so it stands out at a glance even when
     the user is scanning bars across many rows. Late-start uses a softer outline. */
  .gantt-bar.delayed { box-shadow: inset 0 0 0 1.5px var(--fc-danger), 0 1px 3px rgba(255,69,58,0.2); }
  .gantt-bar.delayed.late-start { box-shadow: inset 0 0 0 1.5px var(--fc-warn), 0 1px 3px rgba(255,159,10,0.2); }

  /* WBS toolbar 지연 stat — red value so it pops out of the row of black numbers. */
  #statDelayed .v { color: var(--fc-danger); }
  /* Report 'danger' card variant for the 지연 count. */
  .report-card.danger .value { color: var(--fc-danger); }

  .name-input,
  .text-input,
  .date-input,
  .status-select {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    color: var(--fc-ink);
    padding: 5px 8px;
    border-radius: var(--fc-r-sm);
    font-size: 12.5px;
    font-family: var(--fc-font-body);
    transition: all .12s;
  }
  .name-input { font-weight: 600; letter-spacing: -0.005em; }
  .name-input:hover,
  .text-input:hover,
  .date-input:hover,
  .status-select:hover { background: rgba(255,255,255,0.04); }
  .name-input:focus,
  .text-input:focus,
  .date-input:focus,
  .status-select:focus {
    border-color: var(--fc-accent);
    background: rgba(255,255,255,0.08);
    outline: none;
    box-shadow: 0 0 0 3px var(--fc-accent-2);
  }
  .text-input.rfp { font-family: var(--fc-font-mono); font-size: 11px; }
  .date-input { font-family: var(--fc-font-mono); font-size: 11px; }
  /* Progress cell — track behind the input shows current %; input is conditionally
     editable based on status (locked for completed/not-started/blocked/on-hold). */
  .progress-cell { position: relative; gap: 4px; }
  .progress-track {
    position: absolute;
    inset: 4px 4px;
    border-radius: 6px;
    background: rgba(140, 140, 170, 0.10);
    overflow: hidden;
    pointer-events: none;
  }
  .progress-fill-bar {
    height: 100%;
    transition: width .2s ease, background .2s;
    border-radius: inherit;
  }
  .progress-fill-bar.status-not-started { background: rgba(138,143,152,0.25); }
  .progress-fill-bar.status-in-progress { background: rgba(94,106,210,0.5); }
  .progress-fill-bar.status-completed   { background: rgba(39,166,68,0.45); }
  .progress-fill-bar.status-blocked     { background: rgba(229,72,77,0.4); }
  .progress-fill-bar.status-on-hold     { background: rgba(209,139,42,0.42); }
  .progress-input {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--fc-r-sm);
    color: var(--fc-ink);
    font-family: var(--fc-font-mono);
    font-size: 11.5px;
    font-weight: 600;
    text-align: right;
    padding: 4px 18px 4px 8px;
    -moz-appearance: textfield;
    appearance: textfield;
    position: relative;
    z-index: 1;
  }
  .progress-input::-webkit-outer-spin-button,
  .progress-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .progress-input:hover:not(.locked) { background: rgba(255,255,255,0.04); }
  .progress-input:focus:not(.locked) {
    background: rgba(255,255,255,0.08);
    border-color: var(--fc-accent);
    outline: none;
    box-shadow: 0 0 0 3px var(--fc-accent-2);
  }
  .progress-input.locked {
    cursor: not-allowed;
    color: var(--fc-ink-2);
  }
  .progress-input.locked:hover {
    background: rgba(140, 140, 170, 0.05);
  }
  .progress-pct-suffix {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--fc-font-mono);
    font-size: 10px;
    color: var(--fc-ink-3);
    pointer-events: none;
    z-index: 1;
  }

  /* Derived/rolled-up parent date — visually lighter + italic so it reads as
     "auto-summary from children" rather than a user-set value. Hover to see tooltip. */
  .date-input.derived-value {
    color: var(--fc-ink-3);
    font-style: italic;
    background: rgba(140, 140, 170, 0.10);
    border-color: rgba(140, 140, 170, 0.20);
  }
  .date-input.derived-value:hover { background: rgba(255, 255, 255, 0.06); }
  .date-input.derived-value:focus {
    color: var(--fc-ink);
    font-style: normal;
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--fc-accent);
  }
  .date-input::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.5; }
  .date-input::-webkit-calendar-picker-indicator:hover { opacity: 1; }
  .status-select { font-size: 11px; cursor: pointer; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 500;
    border-radius: var(--fc-r-pill);
    cursor: pointer;
    white-space: nowrap;
    font-family: var(--fc-font-body);
    width: 100%;
    justify-content: center;
    border: 1px solid var(--fc-line);
    background: var(--fc-elev);
    color: var(--fc-ink-2);
    appearance: none;
    -webkit-appearance: none;
    box-shadow: none;
    letter-spacing: 0;
  }
  /* Pill colors use brighter tints on a low-alpha background so the label reads at a
     glance on dark canvas (the underlying accent color was matching its own pill bg
     too closely and washing out). */
  /* Parent rows show their auto-summarised status — italic + cursor:default to flag
     that it's derived (mirrors how `.date-input.derived-value` reads in the date cells). */
  .status-pill.derived-status { font-style: italic; cursor: default; }
  .status-pill:disabled { cursor: default; }
  .status-pill.not-started { color: var(--fc-ink-2); background: var(--fc-elev); }
  .status-pill.in-progress { color: #b5beff;          background: rgba(94,106,210,0.18); border-color: rgba(94,106,210,0.45); }
  .status-pill.completed   { color: #7fe09a;          background: rgba(39,166,68,0.16);  border-color: rgba(39,166,68,0.5); }
  .status-pill.blocked     { color: #ff9ea3;          background: rgba(229,72,77,0.16);  border-color: rgba(229,72,77,0.5); }
  .status-pill.on-hold     { color: #f5cf86;          background: rgba(209,139,42,0.16); border-color: rgba(209,139,42,0.5); }

  /* Row action buttons */
  .row-actions { display: none; gap: 3px; margin-left: auto; }
  .task-row:hover .row-actions { display: inline-flex; }
  .row-btn {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--fc-line);
    color: var(--fc-ink-3);
    cursor: pointer;
    font-size: 10px;
    font-family: var(--fc-font-mono);
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all .12s;
  }
  .row-btn:hover {
    color: var(--fc-ink);
    background: #fff;
    border-color: rgba(255,255,255,0.10);
    transform: translateY(-1px);
  }
  .row-btn.danger:hover {
    color: var(--fc-danger);
    background: var(--fc-danger-2);
    border-color: rgba(255,69,58,0.4);
  }

  /* ───── Gantt ───── */
  .gantt-axis-cell {
    overflow: hidden;
    position: relative;
    border-right: 1px solid var(--fc-line-ink);
  }
  .gantt-axis {
    position: relative;
    height: 40px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--fc-line-ink);
    overflow: hidden;
  }
  .gantt-axis-month {
    position: absolute;
    top: 0;
    height: 20px;
    border-right: 1px solid var(--fc-line-ink);
    color: var(--fc-ink-2);
    font-size: 11px;
    font-weight: 700;
    padding-left: 8px;
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.04);
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .gantt-axis-day {
    position: absolute;
    top: 20px;
    height: 20px;
    width: var(--day-w);
    border-right: 1px solid var(--fc-line-ink);
    color: var(--fc-ink-3);
    font-size: 9.5px;
    font-family: var(--fc-font-mono);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gantt-axis-day.weekend { background: rgba(255,255,255,0.06); }
  .gantt-axis-day.holiday {
    background: rgba(255,69,58,0.10);
    color: var(--fc-danger);
    font-weight: 700;
  }
  .gantt-axis-day.weekend.holiday { background: rgba(255,69,58,0.13); }
  .gantt-axis-day.today {
    background: var(--fc-accent-2);
    color: var(--fc-accent-text);
    font-weight: 700;
  }

  .gantt-cell {
    position: relative;
    height: var(--row-h);
    overflow: hidden;
  }
  /* Weekend overlay — repeating 7-day pattern (5 transparent + 2 shaded). Sits ABOVE
     the bars (z-index 4) with a low-alpha tint so bars get a slightly broken/dimmed
     look as they cross weekends. The horizontal offset aligns the pattern with the
     current rangeStart's day-of-week (set by renderWbs as --weekend-offset). */
  .gantt-cell::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(var(--day-w) * 5),
      rgba(255,255,255,0.06) calc(var(--day-w) * 5),
      rgba(255,255,255,0.06) calc(var(--day-w) * 7)
    );
    background-position: var(--weekend-offset, 0px) 0;
    pointer-events: none;
    z-index: 4;
  }
  /* Holiday strips — same overlay role as weekend pattern but for irregular dates,
     so they're rendered as individual divs from JS. Slightly red-tinted. */
  .gantt-cell .holiday-strip {
    position: absolute;
    top: 0; bottom: 0;
    background: rgba(255,69,58,0.10);
    z-index: 5;
    pointer-events: none;
  }
  .gantt-cell .grid-bg {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(to right, var(--fc-line-ink) 1px, transparent 1px);
    background-size: calc(var(--day-w) * 7) 100%;
    pointer-events: none;
    opacity: 0.6;
  }
  .gantt-cell .today-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 1.5px;
    background: var(--fc-accent);
    opacity: 0.6;
    pointer-events: none;
    box-shadow: 0 0 6px rgba(94,106,210,0.55);
  }
  .gantt-bar {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 18px;
    border-radius: var(--fc-r-sm);
    display: flex;
    align-items: center;
    padding: 0 8px;
    font-size: 10.5px;
    font-weight: 600;
    overflow: hidden;
    white-space: nowrap;
    cursor: default;
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.04), 0 2px 6px rgba(0,0,0,0.4);
    letter-spacing: -0.005em;
  }
  .gantt-bar.not-started {
    background: rgba(138,143,152,0.22);
    border: 1px solid rgba(138,143,152,0.4);
    color: var(--fc-ink-2);
  }
  .gantt-bar.in-progress {
    background: rgba(94,106,210,0.55);
    border: 1px solid rgba(94,106,210,0.75);
    color: #fff;
  }
  .gantt-bar.completed {
    background: rgba(39,166,68,0.45);
    border: 1px solid rgba(39,166,68,0.65);
    color: #d8f5e0;
  }
  .gantt-bar.blocked {
    background: rgba(229,72,77,0.45);
    border: 1px solid rgba(229,72,77,0.65);
    color: #fff;
  }
  .gantt-bar.on-hold {
    background: rgba(209,139,42,0.42);
    border: 1px solid rgba(209,139,42,0.6);
    color: #fbe9c8;
  }
  .gantt-bar.level-1 { height: 22px; font-weight: 600; }

  /* Level-distinguishing left border accent — subtle hint about hierarchy depth
     so summary parents read as "containers" for their children's bars. */
  .gantt-bar.lv-1 { box-shadow: inset 4px 0 0 0 rgba(94,106,210,0.95),  inset 0 1px 0 0 rgba(255,255,255,0.04), 0 2px 6px rgba(0,0,0,0.4); }
  .gantt-bar.lv-2 { box-shadow: inset 3px 0 0 0 rgba(48,209,88,0.85),   inset 0 1px 0 0 rgba(255,255,255,0.04), 0 2px 6px rgba(0,0,0,0.4); }
  .gantt-bar.lv-3 { box-shadow: inset 2px 0 0 0 rgba(191,90,242,0.85),  inset 0 1px 0 0 rgba(255,255,255,0.04), 0 2px 6px rgba(0,0,0,0.4); }
  .gantt-bar.lv-4 { box-shadow: inset 2px 0 0 0 rgba(255,159,10,0.85),  inset 0 1px 0 0 rgba(255,255,255,0.04), 0 2px 6px rgba(0,0,0,0.4); }

  /* Summary / derived bar — used when the parent's own dates are empty and the
     range was rolled up from its sub-tasks. Striped fill + thicker border so
     it visually reads as "container, not user-set". */
  .gantt-bar.derived {
    background-color: transparent !important;
    background-image: repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.10) 0,
      rgba(255,255,255,0.10) 3px,
      transparent 3px,
      transparent 7px
    ) !important;
    border-width: 1.5px;
    border-style: dashed;
    color: var(--fc-ink) !important;
    font-style: italic;
  }
  .gantt-bar.derived.in-progress { border-color: var(--fc-accent); }
  .gantt-bar.derived.completed   { border-color: var(--fc-success); }
  .gantt-bar.derived.blocked     { border-color: var(--fc-danger); }
  .gantt-bar.derived.on-hold     { border-color: var(--fc-warn); }
  .gantt-bar.derived.not-started { border-color: rgba(134,134,139,0.7); }

  /* Empty state */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--fc-ink-3);
    padding: 56px;
    text-align: center;
  }
  .empty .icon {
    font-size: 56px;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--fc-accent), var(--fc-purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0.85;
  }
  .empty h2 {
    font-family: var(--fc-font-display);
    font-weight: 800;
    font-size: 26px;
    margin-bottom: 10px;
    color: var(--fc-ink);
    letter-spacing: -0.022em;
  }
  .empty p {
    font-size: 13.5px;
    line-height: 1.65;
    max-width: 380px;
    margin-bottom: 28px;
    color: var(--fc-ink-2);
  }

  #fileImport { display: none; }

  /* ───── Import mapping modal (Linear dark theme) ───── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10, 12, 18, 0.7);  /* soft dark-grey scrim, matches canvas tone */
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    animation: modal-fade .18s ease-out;
  }
  @keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
  .modal-card {
    position: relative;  /* anchor for the absolute close button */
    background: var(--fc-surface);
    border: 1px solid var(--fc-line);
    border-radius: var(--fc-r-lg);
    padding: 22px 26px;
    width: 92%;
    max-width: 780px;
    max-height: 84vh;
    overflow-y: auto;
    box-shadow: var(--fc-shadow-pop);
    color: var(--fc-ink);
    font-family: var(--fc-font-body);
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--fc-r-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--fc-ink-3);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .modal-close:hover {
    background: var(--fc-elev);
    color: var(--fc-ink);
    border-color: var(--fc-line);
  }
  .modal-close:focus-visible {
    outline: none;
    border-color: var(--fc-accent);
    box-shadow: 0 0 0 3px var(--fc-accent-2);
  }
  .modal-card h2 {
    font-family: var(--fc-font-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    color: var(--fc-ink);
  }
  .modal-hint {
    font-size: 12px;
    color: var(--fc-ink-2);
    line-height: 1.55;
    margin-bottom: 16px;
  }
  .modal-field {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .modal-field label {
    font-size: 10px;
    color: var(--fc-ink-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    min-width: 80px;
  }
  .modal-field select {
    flex: 1;
    padding: 6px 10px;
    background: var(--fc-elev);
    border: 1px solid var(--fc-line);
    border-radius: var(--fc-r-sm);
    font-family: var(--fc-font-body);
    font-size: 12px;
    color: var(--fc-ink);
  }
  .modal-field select:focus,
  .map-grid select:focus {
    outline: none;
    border-color: var(--fc-accent);
    box-shadow: 0 0 0 3px var(--fc-accent-2);
  }
  .map-section-title {
    font-size: 10px;
    color: var(--fc-ink-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    margin: 16px 0 8px;
  }
  .map-grid {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 6px 14px;
    margin-bottom: 14px;
  }
  .map-target {
    font-size: 12px;
    color: var(--fc-ink);
    font-weight: 500;
    display: flex; align-items: center; gap: 4px;
  }
  .map-target .req {
    color: var(--fc-danger);
    font-weight: 700;
  }
  .map-grid select {
    padding: 5px 9px;
    background: var(--fc-elev);
    border: 1px solid var(--fc-line);
    border-radius: var(--fc-r-sm);
    font-family: var(--fc-font-mono);
    font-size: 11px;
    color: var(--fc-ink);
    width: 100%;
  }
  .preview-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 11px;
    border: 1px solid var(--fc-line);
    border-radius: var(--fc-r-sm);
    overflow: hidden;
    background: var(--fc-surface);
  }
  .preview-table th, .preview-table td {
    padding: 5px 8px;
    border-bottom: 1px solid var(--fc-line);
    border-right: 1px solid var(--fc-line);
    text-align: left;
    font-family: var(--fc-font-mono);
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .preview-table th:last-child, .preview-table td:last-child { border-right: none; }
  .preview-table tr:last-child td { border-bottom: none; }
  .preview-table th {
    background: var(--fc-elev);
    color: var(--fc-ink-3);
    font-weight: 700;
    font-family: var(--fc-font-body);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .preview-table td {
    background: transparent;
    color: var(--fc-ink-2);
  }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 10px;
    padding-top: 16px;
    margin-top: 14px;
    border-top: 1px solid var(--fc-line);
  }

  /* ───── Export popover ───── */
  .export-wrap { position: relative; display: inline-flex; }
  .export-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 180px;
    background: var(--fc-surface);
    border: 1px solid var(--fc-line);
    border-radius: var(--fc-r-md);
    box-shadow: var(--fc-shadow-pop);
    padding: 6px;
    z-index: 50;
    display: flex;
    flex-direction: column;

  .export-menu button {
    appearance: none;

  /* ───── Print stylesheet (PDF export) ───── */
  @media print {
    @page { size: A4; margin: 16mm; }
    html, body { overflow: visible !important; height: auto !important; background: #fff !important; color: #111 !important; }

    .pdf-report .meta { font-size: 11px; color: #666; margin-bottom: 16px; }
    /* Cover page — a full-page hero showing just the project name and export date,

    .pdf-report .pdf-cards {
      display: grid;

    .pdf-report .pdf-card { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; }
    .pdf-report .pdf-card .lbl { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
    .pdf-report .pdf-card .val { font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -0.02em; }
    .pdf-report .pdf-card .sub { font-size: 10px; color: #777; margin-top: 2px; }
    .pdf-report .pdf-card.danger .val { color: #c0312e; }
    .pdf-report table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .pdf-report th, .pdf-report td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; vertical-align: top; }

  /* Hidden in screen view — only the print stylesheet shows it. */

<body>
