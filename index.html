//============ New project ============
// Replace the current project with a fresh empty one. The previous project is
// discarded from memory AND overwritten in localStorage, so this is the one true
// data-loss path in the app — callers must guard it via requestNewProject().
function doNewProject() {
  state.project = newProject();
  state.view = "wbs";
  state.filter = { assignee: "", status: "all" };
  colSelection.clear();
  resetHistory();
  $("#projectName").value = state.project.name;
  const af = $("#assigneeFilter"); if (af) af.value = "";
  emit();
  saveSoon();          // persist the empty project + show "saving…/saved"
  state.dirty = false; // an empty project has nothing to lose
}

// Entry point for the "새로 만들기" button. If the current project has
// unsaved-to-file work, ask the user to save / discard / cancel first.
function requestNewProject() {
  if (state.dirty && state.project && state.project.tasks.length > 0) {
    openNewProjectDialog();
  } else {
    doNewProject();
  }
}

// Three-way guard dialog: 저장(JSON export) → discard, 저장 안 함 → discard, 취소 → keep.
// Matches the Import-mapping modal conventions: backdrop does NOT close (explicit
// ×/취소/Esc only) so a stray click can't drop the user's work.
function openNewProjectDialog() {
  const backdrop = el("div", { class: "modal-backdrop" });
  const card = el("div", { class: "modal-card", style: { maxWidth: "440px" }, onclick: e => e.stopPropagation() });
  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  };
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey);

  card.appendChild(el("button", {
    class: "modal-close", type: "button", title: "닫기 (Esc)", "aria-label": "닫기", onclick: close,
  }, ["×"]));
  card.appendChild(el("h2", {}, ["새로 만들기"]));
  card.appendChild(el("div", { class: "modal-hint" }, [
    "저장하지 않은 변경사항이 있습니다.",
    el("br"),
    el("strong", { style: { color: "var(--fc-danger)" } },
      ["저장하지 않고 새로 만들면 현재 내용은 영구히 사라집니다."]),
    el("br"),
    "(현재 작업을 보존하려면 먼저 파일로 저장하세요.)",
  ]));

  const cancelBtn = el("button", { class: "top-btn", onclick: close }, ["취소"]);
  const discardBtn = el("button", {
    class: "top-btn",
    style: { color: "var(--fc-danger)", borderColor: "var(--fc-danger-2)" },
    onclick: () => { close(); doNewProject(); },
  }, ["저장 안 함"]);
  const saveBtn = el("button", {
    class: "top-btn primary",
    onclick: () => { exportJson(); close(); doNewProject(); },
  }, ["저장 후 새로 만들기"]);

  card.appendChild(el("div", { class: "modal-actions" }, [cancelBtn, discardBtn, saveBtn]));
  backdrop.appendChild(card);
  document.body.appendChild(backdrop);
  saveBtn.focus();
}

// Dispatch by file extension: .json → JSON restore, .xlsx → Excel sheet import.
function importProject(file) {
  const lower = file.name.toLowerCase();
  if (lower.endsWith(".xlsx") || lower.endsWith(".xlsm")) {
    importExcel(file);
  } else if (lower.endsWith(".json")) {
    importJson(file);
  } else {
    // Sniff by content as a last resort: JSON starts with { or [, xlsx is a ZIP (PK..).
    const reader = new FileReader();
    reader.onload = e => {
      const head = new Uint8Array(e.target.result.slice(0, 4));
      if (head[0] === 0x50 && head[1] === 0x4b) importExcel(file);
      else importJson(file);
    };
    reader.readAsArrayBuffer(file.slice(0, 4));
  }
}

function importJson(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.tasks)) throw new Error("invalid format: tasks[] missing");
      state.project = {
        version: data.version || SCHEMA_VERSION,
        name: data.name || "imported",
        tasks: data.tasks.map(t => {
          const status = STATUS_LABEL[t.status] ? t.status : "not-started";
          return {
            id: t.id || genId(),
            parent_id: t.parent_id || null,
            level: Math.max(1, Math.min(4, t.level || 1)),
            name: t.name || "",
            rfp_no: t.rfp_no || "",
            assignee: t.assignee || "",
            deliverable: t.deliverable || "",
            status,
            progress: progressForStatus(status, t.progress),
            start_date: t.start_date || "",
            end_date: t.end_date || "",
            expanded: t.expanded !== false,
          };
        }),
        hiddenCols: Array.isArray(data.hiddenCols) ? data.hiddenCols : [],
        deletedCols: Array.isArray(data.deletedCols) ? data.deletedCols : [],
      };
      ensureColumnState(state.project);
      // A deleted column's data is gone from the source rows; if the file carried
      // deletedCols, make sure those fields really are cleared on the imported tasks.
      for (const k of state.project.deletedCols) {
        const meta = colMeta(k), clearVal = clearValueForField(meta.field);
        for (const t of state.project.tasks) t[meta.field] = clearVal;
      }
      reconcileColSelection();
      resetHistory();   // a freshly imported document starts with an empty undo history
      emit(); saveSoon();
    } catch (err) {
      alert("JSON Import 실패: " + err.message);
    }
  };
  reader.readAsText(file);
}

// Convert Excel cell value to ISO YYYY-MM-DD string (or "" if not a date).
//   `contextYear` (optional) is used when the source cell only carries month/day
//   (e.g., "1/15" or "01-15"). Without an explicit context year, we fall back to
//   the current year. The caller is expected to advance contextYear as it walks
//   rows so partial-date cells inherit the most recently seen full-date year.
// Parse a "진행률" cell into a 0-100 integer. Accepts "75", "75%", " 75 % ", "0.75".
function parsePctValue(v) {
  if (v == null || v === "") return 0;
  if (typeof v === "number") {
    return v <= 1 ? Math.round(v * 100) : Math.round(v);
  }
  const s = String(v).trim().replace(/\s+/g, "").replace(/%$/, "");
  if (!s) return 0;
  const n = parseFloat(s);
  if (!Number.isFinite(n)) return 0;
  return n <= 1 ? Math.round(n * 100) : Math.round(n);
}

// Scan a column's values to vote on the date layout (US M/D/Y vs EU D/M/Y vs ISO Y/M/D).
// For each 3-part value, the position whose max exceeds 12 must be the day,
// and a part > 31 must be the year (2-digit year ≤ 99). Returns 'mdy' / 'dmy' /
// 'ymd' / 'unknown'. Caller passes this hint to excelCellToISODate so ambiguous
// rows (`5/8/26` — could be either) consistently follow the column's pattern.
function detectColumnDateLayout(values) {
  let mdy = 0, dmy = 0, ymd = 0;
  for (const v of values) {
    if (v == null || v === "" || v instanceof Date) continue;
    const s = String(v).trim().replace(/\s+/g, "").replace(/\.$/, "");
    if (!s) continue;
    const m = /^(\d{1,4})[.\-/](\d{1,2})[.\-/](\d{1,4})$/.exec(s);
    if (!m) continue;
    const a = parseInt(m[1]), b = parseInt(m[2]), c = parseInt(m[3]);
    // Year-first (4-digit first part) → ymd vote.
    if (m[1].length === 4 || a > 31) { ymd++; continue; }
    // Year-last: first two parts decide M/D vs D/M.
    if (a > 12 && b <= 12) dmy++;        // first must be a day
    else if (b > 12 && a <= 12) mdy++;   // second must be a day
    // both ≤ 12 (e.g., "5/8/26") → no vote, ambiguous.
  }
  const top = Math.max(mdy, dmy, ymd);
  if (top === 0) return "unknown";
  if (ymd === top) return "ymd";
  if (mdy === top) return "mdy";
  return "dmy";
}

function excelCellToISODate(v, contextYear, layoutHint) {
  if (v == null || v === "") return "";
  const pad = (n) => String(n).padStart(2, "0");
  // Native Date (from SheetJS cellDates:true).
  if (v instanceof Date && !isNaN(v)) {
    return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
  }
  // Normalize: trim, strip all internal whitespace, and drop a trailing dot
  // (Korean default Excel format renders as "2026. 1. 15." with spaces and trailing dot).
  let s = String(v).trim().replace(/\s+/g, "").replace(/\.$/, "");
  if (!s) return "";
  // ISO already.
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // Korean style: "2026년1월15일" / "2026년 1월 15일" (after ws strip → "2026년1월15일")
  let m = /^(\d{4})년(\d{1,2})월(\d{1,2})일?$/.exec(s);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  // Full date — year-first: YYYY[ . / - ]M[M][ . / - ]D[D]
  m = /^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})$/.exec(s);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  // Compact YYYYMMDD
  m = /^(\d{4})(\d{2})(\d{2})$/.exec(s);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  // Year-last 3-part: A[.\-/]B[.\-/]C  where C is the year (2 or 4 digits).
  //   Layout disambiguation:
  //     • layoutHint === "dmy"  → A is day, B is month.
  //     • layoutHint === "mdy"  → A is month, B is day (US default).
  //     • unspecified           → infer from values: A > 12 ⇒ swap to D/M/Y; else default M/D/Y.
  //   2-digit year expansion: 00-49 → 20xx, 50-99 → 19xx (Excel pivot convention).
  m = /^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{2}|\d{4})$/.exec(s);
  if (m) {
    let a = parseInt(m[1]), b = parseInt(m[2]);
    let yy = parseInt(m[3]);
    if (m[3].length === 2) yy = yy < 50 ? 2000 + yy : 1900 + yy;
    let mm, dd;
    if (layoutHint === "dmy") { dd = a; mm = b; }
    else if (layoutHint === "mdy") { mm = a; dd = b; }
    else if (a > 12 && b <= 12) { mm = b; dd = a; } // auto-swap when first is clearly a day
    else { mm = a; dd = b; }                         // default M/D/Y
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31 && yy >= 1900 && yy <= 2200) {
      return `${yy}-${pad(mm)}-${pad(dd)}`;
    }
  }
  // Korean partial: "1월15일"
  m = /^(\d{1,2})월(\d{1,2})일?$/.exec(s);
  if (m) {
    const mm = parseInt(m[1]), dd = parseInt(m[2]);
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
      const y = Number.isFinite(contextYear) ? contextYear : new Date().getFullYear();
      return `${y}-${pad(mm)}-${pad(dd)}`;
    }
  }
  // Partial month-day only (M[M] / D[D], M[M] - D[D], M[M] . D[D]).
  // Year falls back to contextYear → current year.
  m = /^(\d{1,2})[.\-/](\d{1,2})$/.exec(s);
  if (m) {
    const mm = parseInt(m[1]), dd = parseInt(m[2]);
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
      const y = Number.isFinite(contextYear) ? contextYear : new Date().getFullYear();
      return `${y}-${pad(mm)}-${pad(dd)}`;
    }
  }
  // Excel serial date (rare since we set cellDates:true, but a safety net).
  const n = Number(s);
  if (Number.isFinite(n) && n > 0 && n < 100000) {
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    if (!isNaN(d)) return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  }
  // Couldn't parse anything — log the offending value with character codes so invisible
  // characters (NBSP, zero-width spaces, BOM, RTL marks) become visible in DevTools.
  if (s) {
    const codes = [...s].map(c => c.charCodeAt(0)).join(",");
    console.warn(
      `[WBS Import] 날짜 인식 실패 — raw: ${JSON.stringify(v)} · normalized: ${JSON.stringify(s)}` +
      ` · type: ${typeof v} · charCodes: [${codes}] · layoutHint: ${layoutHint || "(none)"}`
    );
  }
  return "";
}

// ── Import column mapping (HITL): when a sheet doesn't match the canonical export
//    layout, open a dialog to let the user pick which source column maps to which
//    WBS field. Auto-detection by header-name fuzzy match pre-fills the dropdowns.

// Two distinct mapping shapes:
//   single — one "WBS / 업무명" column carries the task name, optional "Level" column.
//   split  — one column per WBS level (L1~L4). Level is derived from the rightmost
//            non-empty Lx in each row, and the task name = that cell's value.
//            (Common pattern in Korean PM templates: 대분류/중분류/소분류/세분류.)
const COLUMN_MAP_SINGLE = [
  { key: "level",    label: "Level",        required: false, hints: ["level", "레벨", "lvl"] },
  { key: "wbs",      label: "WBS / 업무명", required: true,  hints: ["wbs", "task", "업무", "name", "이름", "title"] },
  { key: "rfp",      label: "RFP No.",      required: false, hints: ["rfp", "id", "no.", "no", "번호", "code"] },
  { key: "assignee", label: "담당자",        required: false, hints: ["담당", "owner", "assignee", "person"] },
  { key: "deliv",    label: "산출물",        required: false, hints: ["산출", "deliv", "output", "artifact", "결과"] },
  { key: "status",   label: "상태",          required: false, hints: ["status", "상태", "state"] },
  { key: "progress", label: "진행률",        required: false, hints: ["진행률", "진행", "progress", "%", "완료율", "달성률", "percent"] },
  { key: "start",    label: "시작일",        required: false, hints: ["시작", "start", "begin", "from", "착수"] },
  { key: "end",      label: "완료일",        required: false, hints: ["완료", "end", "finish", "due", "until", "종료"] },
];
const COLUMN_MAP_SPLIT = [
  { key: "l1",       label: "L1 (대분류)",   required: true,  hints: ["l1", "level 1", "level1", "1단계", "대분류", "1차"] },
  { key: "l2",       label: "L2 (중분류)",   required: false, hints: ["l2", "level 2", "level2", "2단계", "중분류", "2차"] },
  { key: "l3",       label: "L3 (소분류)",   required: false, hints: ["l3", "level 3", "level3", "3단계", "소분류", "3차"] },
  { key: "l4",       label: "L4 (세분류)",   required: false, hints: ["l4", "level 4", "level4", "4단계", "세분류", "4차"] },
  { key: "rfp",      label: "RFP No.",       required: false, hints: ["rfp", "id", "no.", "no", "번호", "code"] },
  { key: "assignee", label: "담당자",         required: false, hints: ["담당", "owner", "assignee", "person"] },
  { key: "deliv",    label: "산출물",         required: false, hints: ["산출", "deliv", "output", "artifact", "결과"] },
  { key: "status",   label: "상태",           required: false, hints: ["status", "상태", "state"] },
  { key: "progress", label: "진행률",         required: false, hints: ["진행률", "진행", "progress", "%", "완료율", "달성률", "percent"] },
  { key: "start",    label: "시작일",         required: false, hints: ["시작", "start", "begin", "from", "착수"] },
  { key: "end",      label: "완료일",         required: false, hints: ["완료", "end", "finish", "due", "until", "종료"] },
];
// Back-compat shim — older code referenced COLUMN_MAP_TARGETS (single mode).
const COLUMN_MAP_TARGETS = COLUMN_MAP_SINGLE;

// Auto-pick the most plausible mode based on header names:
// if ≥2 columns look like L1/L2/L3/L4 (or Korean equivalents), default to split mode.
function detectImportMode(headers) {
  const lvlPattern = /^(l[1-4]|level\s*[1-4]|[1-4]단계|[1-4]차)$/i;
  const matches = headers.filter(h => lvlPattern.test(String(h ?? "").trim().replace(/\s+/g, " ")));
  return matches.length >= 2 ? "split" : "single";
}

function autoDetectMapping(headers, mode = "single") {
  const map = {};
  const lower = headers.map(h => String(h ?? "").trim().toLowerCase());
  const targets = mode === "split" ? COLUMN_MAP_SPLIT : COLUMN_MAP_SINGLE;
  for (const target of targets) {
    let found = -1;
    for (const h of target.hints) {
      const i = lower.findIndex(x => x === h.toLowerCase());
      if (i >= 0) { found = i; break; }
    }
    if (found < 0) {
      for (const h of target.hints) {
        const i = lower.findIndex(x => x && x.includes(h.toLowerCase()));
        if (i >= 0) { found = i; break; }
      }
    }
    map[target.key] = found;
  }
  return map;
}

// Build tasks from data rows (header already stripped) using a user-defined mapping.
// `mode` is "single" (one WBS column + optional Level) or "split" (L1~L4 separate cols).
// Partial dates (MM/DD only) inherit the year from the most recently seen full date.
function buildTasksFromMapping(dataRows, mapping, mode = "single") {
  const out = [];
  const lastAtLevel = {};
  const get = (r, key) => mapping[key] >= 0 ? r[mapping[key]] : undefined;

  // Year context for partial dates. Initialized to the current year, then bumped
  // whenever we successfully parse a full date with a year.
  let contextYear = new Date().getFullYear();
  const advanceContextYearFromISO = (iso) => {
    if (!iso) return;
    const y = parseInt(iso.slice(0, 4));
    if (Number.isFinite(y) && y >= 1970) contextYear = y;
  };

  // Pre-scan start AND end columns combined to vote on the date layout. Both columns
  // typically share the same format, so combining gives more evidence. The hint then
  // disambiguates rows like "5/8/26" — without it we'd default to M/D/Y, but if the
  // column elsewhere has "17/8/26", the dmy vote wins for the whole column.
  const layoutSamples = [];
  if (mapping.start >= 0) for (const r of dataRows) if (r) layoutSamples.push(r[mapping.start]);
  if (mapping.end   >= 0) for (const r of dataRows) if (r) layoutSamples.push(r[mapping.end]);
  const layoutHint = detectColumnDateLayout(layoutSamples);
  if (layoutHint !== "unknown") {
    console.info(`[WBS Import] 날짜 layout 감지: ${layoutHint} (${layoutSamples.filter(v => v != null && v !== "").length}개 셀 기반)`);
  }

  const pushTask = (r, level, name) => {
    // Walk UP from level-1 looking for the nearest existing ancestor — handles Excel
    // sheets that skip an intermediate level (e.g., an L3 row arrives before any L2
    // has been seen in the current branch). Without this, the L3 would orphan to
    // parent_id=null and an upstream L2 would never receive its child for status rollup.
    let parentId = null;
    for (let lv = level - 1; lv >= 1; lv--) {
      if (lastAtLevel[lv]) { parentId = lastAtLevel[lv]; break; }
    }
    const start = excelCellToISODate(get(r, "start"), contextYear, layoutHint);
    advanceContextYearFromISO(start);
    const end = excelCellToISODate(get(r, "end"), contextYear, layoutHint);
    advanceContextYearFromISO(end);
    const status = STATUS_VALUE_BY_LABEL[String(get(r, "status") ?? "").trim()] || "not-started";
    const t = {
      id: genId(),
      parent_id: parentId,
      level,
      name,
      rfp_no: String(get(r, "rfp") ?? "").trim(),
      assignee: String(get(r, "assignee") ?? "").trim(),
      deliverable: String(get(r, "deliv") ?? "").trim(),
      status,
      progress: progressForStatus(status, parsePctValue(get(r, "progress"))),
      start_date: start,
      end_date: end,
      expanded: true,
    };
    out.push(t);
    lastAtLevel[level] = t.id;
    for (let k = level + 1; k <= 4; k++) delete lastAtLevel[k];
  };

  for (let i = 0; i < dataRows.length; i++) {
    const r = dataRows[i];
    if (!r) continue;
    if (mode === "split") {
      let level = 0, name = "";
      for (let lv = 1; lv <= 4; lv++) {
        const idx = mapping[`l${lv}`];
        if (idx == null || idx < 0) continue;
        const v = String(r[idx] ?? "").trim();
        if (v) { level = lv; name = v; }
      }
      if (!level || !name) continue;
      pushTask(r, level, name);
    } else {
      let lv = parseInt(get(r, "level"));
      if (!Number.isFinite(lv) || lv < 1) lv = 1;
      if (lv > 4) lv = 4;
      const name = String(get(r, "wbs") ?? "").replace(/^\s+/, "").trim();
      if (!name) continue;
      pushTask(r, lv, name);
    }
  }
  return out;
}

// Multi-row header support. Many real-world templates put a category in row 1
// (often merged across columns — e.g., "일정") and the sub-headers in row 2
// ("시작" / "종료"). We collapse multiple header rows into a single effective
// header string per column so the rest of the import flow works unchanged.
function detectHeaderRowCount(ws, rows) {
  const merges = ws && ws["!merges"] ? ws["!merges"] : [];
  // (A) Row 0 has any horizontal merge spanning ≥ 2 columns → almost certainly a 2-row header.
  if (merges.some(m => m.s.r === 0 && m.e.r === 0 && m.e.c > m.s.c)) return 2;
  if (rows.length < 2) return 1;

  const r0 = rows[0] || [];
  const r1 = rows[1] || [];
  const nonEmpty = (arr) => arr.filter(c => String(c ?? "").trim()).length;
  const n0 = nonEmpty(r0), n1 = nonEmpty(r1);

  // (B) Sparse row 0 + dense row 1.
  if (n1 > 0 && n1 >= n0 + 2 && n0 < r0.length * 0.7) return 2;

  // (C) Adjacent duplicates in row 0 (unmerged categorical labels — common when a user
  // writes "plan" twice instead of merging the cells).
  let adjDups = 0;
  for (let i = 1; i < r0.length; i++) {
    const a = String(r0[i] ?? "").trim();
    const b = String(r0[i - 1] ?? "").trim();
    if (a && a === b) adjDups++;
  }
  if (adjDups >= 1 && n1 > 0) return 2;

  // (D) Row 1 contains ≥ 2 recognizable sub-header keywords (start/end/시작/종료/...).
  // Strong signal that row 1 is a sub-header, not data.
  const subPattern = /^(시작(일)?|종료(일)?|착수(일)?|완료(일)?|start(\s*date)?|end(\s*date)?|begin|finish|due|from|to|기간)$/i;
  const r1Sub = r1.filter(c => subPattern.test(String(c ?? "").trim())).length;
  if (r1Sub >= 2) return 2;

  return 1;
}

function buildEffectiveHeaders(rows, headerRowCount, merges = []) {
  if (headerRowCount <= 1) {
    return (rows[0] || []).map(h => String(h ?? "").trim());
  }
  // Two (or more) header rows. Propagate merged top-row values across their span,
  // then concatenate row[0] / row[1] / ... per column.
  const propagated = [];
  for (let r = 0; r < headerRowCount; r++) {
    const row = [...(rows[r] || [])];
    // Apply horizontal merges that originate on this row.
    for (const m of (merges || [])) {
      if (m.s.r === r && m.e.r >= r && m.e.c > m.s.c) {
        const v = row[m.s.c];
        for (let c = m.s.c + 1; c <= m.e.c; c++) {
          if (row[c] == null || String(row[c]).trim() === "") row[c] = v;
        }
      }
    }
    propagated.push(row);
  }
  const width = Math.max(...propagated.map(r => r.length), 0);
  const out = [];
  for (let i = 0; i < width; i++) {
    const parts = [];
    for (let r = 0; r < headerRowCount; r++) {
      const v = String(propagated[r][i] ?? "").trim();
      if (v && !parts.includes(v)) parts.push(v);
    }
    out.push(parts.join(" / "));
  }
  return out;
}

// Encapsulate sheet metadata so it can be re-derived when the user toggles
// headerRowCount in the dialog.
function makeSheetMeta(name, ws, rows, headerRowCount) {
  const merges = (ws && ws["!merges"]) || [];
  const headers = buildEffectiveHeaders(rows, headerRowCount, merges);
  const dataRows = rows.slice(headerRowCount);
  return {
    name, rows, merges, headerRowCount,
    headers, dataRows,
    dataRowCount: dataRows.length,
  };
}

// Re-derive headers/dataRows in-place when the user toggles header row count.
function remakeSheetMeta(meta, newHeaderRowCount) {
  meta.headerRowCount = newHeaderRowCount;
  meta.headers = buildEffectiveHeaders(meta.rows, newHeaderRowCount, meta.merges);
  meta.dataRows = meta.rows.slice(newHeaderRowCount);
  meta.dataRowCount = meta.dataRows.length;
  return meta;
}

// A → A, Z → Z, AA → AA, etc. (Excel-style column letters)
function excelColumnLetter(idx) {
  let s = "", n = idx;
  do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return s;
}

// Open the mapping dialog for a workbook that has no canonical match.
// `workbookMeta` = { XLSX, sheets: [{ name, headers, rows, dataRowCount }], fileName }
function openImportMappingDialog(workbookMeta) {
  const { sheets, fileName } = workbookMeta;
  if (!sheets.length) { alert("⚠ 빈 파일입니다."); return; }

  let activeIdx = 0;
  // Mode auto-detected from the first sheet's headers (split if L1/L2/... pattern found).
  let mode = detectImportMode(sheets[0].headers);
  let mapping = autoDetectMapping(sheets[0].headers, mode);

  // ── DOM scaffold ──
  const backdrop = el("div", { class: "modal-backdrop" });
  const card = el("div", { class: "modal-card", onclick: e => e.stopPropagation() });
  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  };
  // Esc closes the modal — quick keyboard exit alongside the X / Cancel buttons.
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey);
  // NOTE: backdrop click does NOT close — explicit X / Cancel / Esc only (matches vk8s
  // policy so accidental mouse-drifts don't drop the user's mapping work).

  // Top-right close (×) — same dismiss as Cancel, mirrors common modal UX.
  card.appendChild(el("button", {
    class: "modal-close",
    type: "button",
    title: "닫기 (Esc)",
    "aria-label": "닫기",
    onclick: close,
  }, ["×"]));

  card.appendChild(el("h2", {}, ["Excel Import — 컬럼 매핑"]));
  card.appendChild(el("div", { class: "modal-hint" }, [
    `'${fileName}' — 양식이 WBS 표준과 다르거나 사용자 정의 양식입니다.`,
    el("br"),
    `왼쪽이 WBS 필드, 오른쪽이 소스(Excel) 컬럼. * 표시는 필수.`,
  ]));

  // ── Mode toggle: single column vs L1~L4 split columns ──
  const modeBox = el("div", {
    style: { display: "flex", gap: "8px", margin: "12px 0 8px", alignItems: "center" },
  });
  modeBox.appendChild(el("label", {
    style: { fontSize: "10px", color: "var(--fc-ink-3)", textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700, minWidth: "80px" },
  }, ["Mode"]));
  const mkModeBtn = (id, label, sub) => el("button", {
    class: "top-btn" + (mode === id ? " primary" : ""),
    style: { padding: "5px 10px", fontSize: "11px", display: "flex", flexDirection: "column", alignItems: "flex-start", lineHeight: 1.25 },
    onclick: () => {
      if (mode === id) return;
      mode = id;
      mapping = autoDetectMapping(sheets[activeIdx].headers, mode);
      // Re-style buttons
      modeBox.querySelectorAll("button").forEach(b => b.classList.toggle("primary", b.dataset.mode === mode));
      rebuildBody();
    },
    dataset: { mode: id },
  }, [
    el("span", { style: { fontWeight: 700 } }, [label]),
    el("span", { style: { fontSize: "10px", opacity: 0.75 } }, [sub]),
  ]);
  modeBox.appendChild(mkModeBtn("single", "단일 업무명 컬럼", "Level + 한 컬럼"));
  modeBox.appendChild(mkModeBtn("split",  "L1~L4 분리 컬럼", "레벨별 한 컬럼"));
  card.appendChild(modeBox);

  // ── Sheet picker / Header rows ── (kept in sync via shared helpers)
  const activeSheet = () => sheets[activeIdx];
  const sheetSummary = (s) => `${s.name} — ${s.dataRowCount}행 × ${s.headers.length}열`;

  let sheetSel = null;
  let sheetReadonlyDiv = null;
  if (sheets.length > 1) {
    sheetSel = el("select", {
      onchange: e => {
        activeIdx = parseInt(e.target.value);
        const detected = detectImportMode(activeSheet().headers);
        if (detected !== mode) {
          mode = detected;
          syncModeButtons();
        }
        mapping = autoDetectMapping(activeSheet().headers, mode);
        syncHdrButtons();
        rebuildBody();
      },
    }, sheets.map((s, i) => el("option", { value: i, selected: i === activeIdx ? "" : null },
      [sheetSummary(s)])));
    card.appendChild(el("div", { class: "modal-field" }, [
      el("label", {}, ["Sheet"]),
      sheetSel,
    ]));
  } else {
    sheetReadonlyDiv = el("div", {
      style: { fontSize: "12px", color: "var(--fc-ink-2)", fontFamily: "var(--fc-font-mono)" },
    }, [sheetSummary(sheets[0])]);
    card.appendChild(el("div", { class: "modal-field" }, [
      el("label", {}, ["Sheet"]),
      sheetReadonlyDiv,
    ]));
  }
  const syncSheetSummary = () => {
    if (sheetSel) {
      const opt = sheetSel.querySelector(`option[value="${activeIdx}"]`);
      if (opt) opt.textContent = sheetSummary(activeSheet());
    } else if (sheetReadonlyDiv) {
      sheetReadonlyDiv.textContent = sheetSummary(activeSheet());
    }
  };

  // ── Header rows control: 1 or 2. Default is the auto-detected value per sheet. ──
  // Many templates use a 2-row header (e.g. "일정" merged over "시작"/"종료").
  const hdrBtnGroup = el("div", { style: { display: "flex", gap: "4px" } });
  const mkHdrBtn = (n, label) => el("button", {
    class: "top-btn" + (activeSheet().headerRowCount === n ? " primary" : ""),
    style: { padding: "5px 12px", fontSize: "11px", fontFamily: "var(--fc-font-mono)" },
    dataset: { hdr: String(n) },
    onclick: () => {
      if (activeSheet().headerRowCount === n) return;
      remakeSheetMeta(activeSheet(), n);
      // Headers changed → re-detect mode + mapping.
      const detected = detectImportMode(activeSheet().headers);
      if (detected !== mode) {
        mode = detected;
        syncModeButtons();
      }
      mapping = autoDetectMapping(activeSheet().headers, mode);
      syncHdrButtons();
      syncSheetSummary();
      rebuildBody();
    },
  }, [label]);
  hdrBtnGroup.appendChild(mkHdrBtn(1, "1 row"));
  hdrBtnGroup.appendChild(mkHdrBtn(2, "2 rows"));
  const hdrHint = el("span", {
    style: { fontSize: "10px", color: "var(--fc-ink-3)", fontStyle: "italic" },
  }, ["병합된 상단 셀(예: '일정')은 자동으로 하위 셀과 합쳐집니다 — '일정 / 시작'"]);
  card.appendChild(el("div", { class: "modal-field" }, [
    el("label", {}, ["Header rows"]),
    hdrBtnGroup,
    hdrHint,
  ]));

  function syncHdrButtons() {
    hdrBtnGroup.querySelectorAll("button").forEach(b =>
      b.classList.toggle("primary", b.dataset.hdr === String(activeSheet().headerRowCount)));
  }
  function syncModeButtons() {
    modeBox.querySelectorAll("button").forEach(b =>
      b.classList.toggle("primary", b.dataset.mode === mode));
  }

  const body = el("div");
  card.appendChild(body);

  // Status text shown if mapping is incomplete
  const importBtn = el("button", { class: "top-btn primary" }, ["Import"]);
  const cancelBtn = el("button", { class: "top-btn", onclick: close }, ["Cancel"]);

  function rebuildBody() {
    body.innerHTML = "";
    const sheet = sheets[activeIdx];
    const targets = mode === "split" ? COLUMN_MAP_SPLIT : COLUMN_MAP_SINGLE;

    // Mapping grid
    body.appendChild(el("div", { class: "map-section-title" }, ["컬럼 매핑"]));
    const grid = el("div", { class: "map-grid" });
    for (const target of targets) {
      const sel = el("select", {
        onchange: e => {
          mapping[target.key] = parseInt(e.target.value);
          updatePreview();
        },
      }, [
        el("option", { value: -1, selected: mapping[target.key] === -1 ? "" : null }, ["— (사용 안함)"]),
        ...sheet.headers.map((h, i) => el("option", {
          value: i, selected: mapping[target.key] === i ? "" : null,
        }, [`${excelColumnLetter(i)}. ${h || "(빈 헤더)"}`])),
      ]);
      grid.appendChild(el("div", { class: "map-target" }, [
        target.label,
        target.required ? el("span", { class: "req" }, ["*"]) : null,
      ]));
      grid.appendChild(sel);
    }
    body.appendChild(grid);

    // Preview
    body.appendChild(el("div", { class: "map-section-title" }, ["미리보기 (처음 5 행)"]));
    const previewWrap = el("div", { id: "preview-wrap" });
    body.appendChild(previewWrap);
    updatePreview();
  }

  function updatePreview() {
    const wrap = card.querySelector("#preview-wrap");
    if (!wrap) return;
    wrap.innerHTML = "";
    const sheet = sheets[activeIdx];
    const sampleRows = sheet.dataRows.slice(0, 5); // first 5 data rows (header already stripped)
    if (sampleRows.length === 0) {
      wrap.appendChild(el("div", {
        style: { fontSize: "11px", color: "var(--fc-ink-3)", fontStyle: "italic" },
      }, ["데이터 행이 없습니다."]));
      return;
    }
    // Preview columns: always show the resolved Level + Name first, then the rest.
    // In split mode "Level" and "WBS / 업무명" are derived per row; in single mode they
    // come directly from the mapped columns.
    const resolvedCols = ["Level", "WBS / 업무명", "RFP No.", "담당자", "산출물", "상태", "시작일", "완료일"];
    const resolveRow = (r) => {
      const out = {};
      const get = (key) => mapping[key] >= 0 && r ? r[mapping[key]] : undefined;
      if (mode === "split") {
        let lv = 0, name = "";
        for (let n = 1; n <= 4; n++) {
          const idx = mapping[`l${n}`];
          if (idx == null || idx < 0) continue;
          const v = String(r?.[idx] ?? "").trim();
          if (v) { lv = n; name = v; }
        }
        out["Level"] = lv || "—";
        out["WBS / 업무명"] = name || "—";
      } else {
        const lvRaw = parseInt(get("level"));
        out["Level"] = Number.isFinite(lvRaw) ? lvRaw : "—";
        const nm = String(get("wbs") ?? "").trim();
        out["WBS / 업무명"] = nm || "—";
      }
      out["RFP No."]  = String(get("rfp")      ?? "").trim() || "—";
      out["담당자"]   = String(get("assignee") ?? "").trim() || "—";
      out["산출물"]   = String(get("deliv")    ?? "").trim() || "—";
      out["상태"]     = String(get("status")   ?? "").trim() || "—";
      const sv = get("start"); out["시작일"] = (sv instanceof Date ? excelCellToISODate(sv) : String(sv ?? "").trim()) || "—";
      const ev = get("end");   out["완료일"] = (ev instanceof Date ? excelCellToISODate(ev) : String(ev ?? "").trim()) || "—";
      return out;
    };

    const table = el("table", { class: "preview-table" });
    table.appendChild(el("thead", {}, [
      el("tr", {}, resolvedCols.map(c => el("th", {}, [c]))),
    ]));
    const tbody = el("tbody");
    for (const r of sampleRows) {
      const v = resolveRow(r);
      tbody.appendChild(el("tr", {}, resolvedCols.map(c =>
        el("td", { title: String(v[c]) }, [String(v[c])]))));
    }
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  importBtn.addEventListener("click", () => {
    const sheet = sheets[activeIdx];
    // Required-field validation depends on mode.
    if (mode === "split") {
      if ((mapping.l1 ?? -1) < 0) {
        alert("'L1 (대분류)' 컬럼은 필수입니다. 매핑해주세요.");
        return;
      }
    } else {
      if ((mapping.wbs ?? -1) < 0) {
        alert("'WBS / 업무명' 컬럼은 필수입니다. 매핑해주세요.");
        return;
      }
    }
    const tasks = buildTasksFromMapping(sheet.dataRows, mapping, mode);
    if (tasks.length === 0) {
      alert(mode === "split"
        ? "이 매핑으로 import할 행이 없습니다 (L1~L4가 모두 비어 있는 행만 존재)."
        : "이 매핑으로 import할 행이 없습니다 (WBS / 업무명이 모두 비어 있음).");
      return;
    }
    state.project = {
      version: SCHEMA_VERSION,
      name: (sheet.name && sheet.name !== "WBS")
        ? sheet.name
        : (state.project.name || (fileName || "imported").replace(/\.[^.]+$/, "")),
      tasks,
    };
    emit(); saveSoon();
    $("#saveStatus").textContent = `${tasks.length}건 import됨 (custom mapping · ${mode})`;
    setTimeout(() => { if (/import됨/.test($("#saveStatus").textContent)) $("#saveStatus").textContent = ""; }, 2000);
    close();
  });
  card.appendChild(el("div", { class: "modal-actions" }, [cancelBtn, importBtn]));

  backdrop.appendChild(card);
  document.body.appendChild(backdrop);
  rebuildBody();
}

// Build task tree from a sheet by Level + row order (preorder).
//   levelStack[lv] = id of the most recent task at level lv → parent of next task at lv+1.
function sheetRowsToTasks(headers, rows) {
  const colIdx = Object.fromEntries(EXCEL_HEADERS.map(h => [h, headers.indexOf(h)]));
  const cell = (row, name) => {
    const i = colIdx[name];
    return i >= 0 ? row[i] : undefined;
  };
  const out = [];
  const lastAtLevel = {};
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;
    const rawLv = cell(r, "Level");
    const lv = Math.max(1, Math.min(4, parseInt(rawLv) || 1));
    // WBS column carries the indented name — strip leading spaces.
    const nameRaw = String(cell(r, "WBS") ?? "").replace(/^\s+/, "").trim();
    const rfp = String(cell(r, "RFP No.") ?? "").trim();
    const assignee = String(cell(r, "담당자") ?? "").trim();
    const deliv = String(cell(r, "산출물") ?? "").trim();
    const statusLabel = String(cell(r, "상태") ?? "").trim();
    const progRaw = cell(r, "진행률");
    // Skip rows that look completely empty.
    if (!nameRaw && !rfp && !assignee && !deliv && !statusLabel) continue;
    const parentId = lv > 1 ? (lastAtLevel[lv - 1] || null) : null;
    const status = STATUS_VALUE_BY_LABEL[statusLabel] || "not-started";
    const t = {
      id: genId(),
      parent_id: parentId,
      level: lv,
      name: nameRaw,
      rfp_no: rfp,
      assignee,
      deliverable: deliv,
      status,
      progress: progressForStatus(status, parsePctValue(progRaw)),
      start_date: excelCellToISODate(cell(r, "시작일")),
      end_date: excelCellToISODate(cell(r, "완료일")),
      expanded: true,
    };
    out.push(t);
    lastAtLevel[lv] = t.id;
    // Invalidate deeper levels; a new branch starts fresh.
    for (let k = lv + 1; k <= 4; k++) delete lastAtLevel[k];
  }
  return out;
}

async function importExcel(file) {
  let XLSX;
  $("#saveStatus").textContent = "엑셀 읽는중…";
  try {
    XLSX = await import("https://esm.sh/xlsx@0.18.5");
  } catch (err) {
    $("#saveStatus").textContent = "";
    alert("Excel 라이브러리 로드 실패 (네트워크?).\n\n" + err.message);
    return;
  }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });

    // Classify every sheet as match / partial / non-matching by checking header row.
    const matching = [];
    const partial = [];
    const other = [];
    for (const sheetName of wb.SheetNames) {
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
      if (!rows.length) { other.push({ name: sheetName, why: "빈 시트" }); continue; }
      const headers = rows[0].map(h => String(h ?? "").trim());
      const have = new Set(headers);
      const missing = EXCEL_HEADERS.filter(h => !have.has(h));
      if (missing.length === 0) {
        matching.push({ name: sheetName, headers, rows });
      } else if (missing.length <= 2 && EXCEL_HEADERS.filter(h => have.has(h)).length >= EXCEL_HEADERS.length - 2) {
        partial.push({ name: sheetName, missing });
      } else {
        other.push({ name: sheetName, why: "양식 불일치" });
      }
    }

    if (matching.length === 0) {
      $("#saveStatus").textContent = "";
      // No canonical match → open the HITL mapping dialog. Build full sheet meta with
      // auto-detected header row count so 2-row headers (merged "일정" / "시작·종료")
      // are collapsed into single effective column names from the start.
      const allSheets = wb.SheetNames.map(sheetName => {
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });
        const headerRowCount = detectHeaderRowCount(ws, rows);
        return makeSheetMeta(sheetName, ws, rows, headerRowCount);
      }).filter(s => s.headers.length > 0);

      if (!allSheets.length) {
        alert("⚠ 이 파일에는 헤더가 있는 시트가 없습니다.");
        return;
      }
      openImportMappingDialog({ XLSX, wb, sheets: allSheets, fileName: file.name });
      return;
    }

    const chosen = matching[0];
    // Build warning about what was ignored.
    const ignoredMsgs = [];
    if (matching.length > 1) {
      ignoredMsgs.push(`여러 시트가 양식과 일치 — 첫 번째 '${chosen.name}'만 import.\n무시: ${matching.slice(1).map(s => s.name).join(", ")}`);
    }
    if (partial.length) {
      ignoredMsgs.push(`누락 컬럼 있는 시트는 무시: ${partial.map(p => `${p.name}(누락: ${p.missing.join(",")})`).join(" · ")}`);
    }
    if (other.length) {
      ignoredMsgs.push(`양식과 무관한 시트는 무시: ${other.map(o => o.name).join(", ")}`);
    }
    if (ignoredMsgs.length) alert("⚠ " + ignoredMsgs.join("\n\n"));

    const tasks = sheetRowsToTasks(chosen.headers, chosen.rows);
    if (tasks.length === 0) {
      $("#saveStatus").textContent = "";
      alert(`'${chosen.name}' 시트의 양식은 맞지만 import할 행이 없습니다.`);
      return;
    }
    state.project = {
      version: SCHEMA_VERSION,
      name: chosen.name && chosen.name !== "WBS" ? chosen.name : (state.project.name || "imported"),
      tasks,
      hiddenCols: [],
      deletedCols: [],
    };
    reconcileColSelection();
    resetHistory();
    emit(); saveSoon();
    $("#saveStatus").textContent = `${tasks.length}건 import됨`;
    setTimeout(() => { if (/import됨$/.test($("#saveStatus").textContent)) $("#saveStatus").textContent = ""; }, 1800);
  } catch (err) {
    console.error(err);
    $("#saveStatus").textContent = "";
    alert("Excel Import 실패: " + err.message);
  }
}

//============ Init ============
function init() {
  // Apply persisted column widths before first render so the layout doesn't flash defaults.
  loadColumnWidths();
  state.project = loadProject() || newProject();
  ensureColumnState(state.project);   // guarantee hiddenCols/deletedCols exist
  applyGridColumns();                 // build the initial grid track list from visible columns
  resetHistory();                     // start with an empty undo history
  // Loaded content lives in localStorage but not in a file — treat it as unsaved-to-file
  // so "새로 만들기" warns before discarding it. A fresh empty project has nothing to lose.
  state.dirty = state.project.tasks.length > 0;

  // Top bar
  $("#projectName").addEventListener("input", e => {
    state.project.name = e.target.value;
    saveSoon();
  });
  $("#btnAddRoot").addEventListener("click", () => addTask(null));
  $("#btnUndo").addEventListener("click", undo);
  $("#btnRedo").addEventListener("click", redo);
  $("#btnNew").addEventListener("click", requestNewProject);
  $("#btnImport").addEventListener("click", () => $("#fileImport").click());
  $("#fileImport").addEventListener("change", e => {
    const f = e.target.files[0];
    if (f) importProject(f);
    e.target.value = "";
  });
  // Export — single button opens a popover; the menu item dispatches to the right fn.
  const exportBtn = $("#btnExport");
  const exportMenu = $("#exportMenu");
  const setMenuOpen = (open) => {
    exportMenu.hidden = !open;
    exportBtn.setAttribute("aria-expanded", String(!!open));
  };
  exportBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setMenuOpen(exportMenu.hidden);
  });
  exportMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-fmt]");
    if (!btn) return;
    setMenuOpen(false);
    const fmt = btn.dataset.fmt;
    if      (fmt === "xlsx") exportExcel();
    else if (fmt === "json") exportJson();
    else if (fmt === "pdf")  exportPdf();
  });
  document.addEventListener("click", (e) => {
    if (!exportMenu.hidden && !e.target.closest(".export-wrap")) setMenuOpen(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !exportMenu.hidden) setMenuOpen(false);
  });

  // Undo / redo: Ctrl/⌘+Z, and Ctrl/⌘+Shift+Z or Ctrl+Y for redo. We commit any focused
  // inline edit first (blur fires its change handler → one undo step for that edit), then
  // run undo/redo. This intercepts the browser's native text-undo while a field is focused,
  // which is the intended trade-off: Ctrl+Z always means "undo my last change" here.
  document.addEventListener("keydown", (e) => {
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    const isRedo = (k === "z" && e.shiftKey) || (k === "y" && !e.shiftKey);
    const isUndo = k === "z" && !e.shiftKey;
    if (!isUndo && !isRedo) return;
    e.preventDefault();
    const ae = document.activeElement;
    if (ae && ae.matches && ae.matches("input, textarea, select")) ae.blur();
    if (isRedo) redo(); else undo();
  });

  $("#btnReport").addEventListener("click", () => {
    state.view = state.view === "report" ? "wbs" : "report";
    emit();
  });

  // Status filter buttons (완료/진행중/지연) — same-button click toggles back to "all".
  document.querySelectorAll(".toolbar .stat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const f = btn.dataset.statusFilter;
      state.filter.status = state.filter.status === f ? "all" : f;
      emit();
    });
  });

  // Assignee filter
  $("#assigneeFilter").addEventListener("input", e => {
    state.filter.assignee = e.target.value.trim();
    emit();
  });
  $("#assigneeFilterClear").addEventListener("click", () => {
    $("#assigneeFilter").value = "";
    state.filter.assignee = "";
    $("#assigneeFilter").focus();
    emit();
  });

  // Kick off holiday data fetch (report view re-renders when it resolves).
  loadHolidays();

  // Zoom buttons
  document.querySelectorAll(".zoom button").forEach(btn => {
    btn.addEventListener("click", () => {
      const px = parseInt(btn.dataset.zoom);
      document.documentElement.style.setProperty("--day-w", px + "px");
      document.querySelectorAll(".zoom button").forEach(b => b.classList.toggle("active", b === btn));
      emit();
    });
  });

  subscribe(render);
  emit();
}

document.addEventListener("DOMContentLoaded", init);
</script>
