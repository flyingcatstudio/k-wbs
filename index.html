<script>
"use strict";

//============ Constants ============
const STORAGE_KEY = "k-wbs.project.current";
const WBS_COLWIDTHS_KEY = "k-wbs.col-widths";

// Resizable data columns (NOT the Gantt — that one stays `1fr` flex).
// `cssVar` maps to the CSS custom property used by .grid-row's grid-template-columns.
// `field` = the task property this column edits (used when 삭제 wipes the column's data).
// `protected: true` = the column can't be hidden or deleted (name is the task's identity).
const RESIZABLE_COLUMNS = [
  { key: "name",     cssVar: "--col-name-w",     label: "업무명",   min: 160, default: 320, field: "name",        protected: true },
  { key: "rfp",      cssVar: "--col-rfp-w",      label: "RFP No.", min: 60,  default: 96,  field: "rfp_no"      },
  { key: "assignee", cssVar: "--col-assignee-w", label: "담당자",  min: 60,  default: 108, field: "assignee"    },
  { key: "deliv",    cssVar: "--col-deliv-w",    label: "산출물",  min: 80,  default: 144, field: "deliverable" },
  { key: "status",   cssVar: "--col-status-w",   label: "상태",    min: 80,  default: 116, field: "status"      },
  { key: "progress", cssVar: "--col-progress-w", label: "진행률",  min: 70,  default: 96,  field: "progress"    },
  { key: "start",    cssVar: "--col-start-w",    label: "시작일",  min: 90,  default: 124, field: "start_date"  },
  { key: "end",      cssVar: "--col-end-w",      label: "완료일",  min: 90,  default: 124, field: "end_date"    },
];
const COLUMN_BY_KEY = Object.fromEntries(RESIZABLE_COLUMNS.map(c => [c.key, c]));
function colMeta(key) { return COLUMN_BY_KEY[key]; }

function loadColumnWidths() {
  try {
    const raw = localStorage.getItem(WBS_COLWIDTHS_KEY);
    if (!raw) return;
    const stored = JSON.parse(raw);
    for (const col of RESIZABLE_COLUMNS) {
      const w = parseInt(stored[col.key]);
      if (Number.isFinite(w) && w >= col.min) {
        document.documentElement.style.setProperty(col.cssVar, w + "px");
      }
    }
  } catch { /* ignore corrupt storage */ }
}

function saveColumnWidth(key, widthPx) {
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(WBS_COLWIDTHS_KEY) || "{}"); } catch {}
  stored[key] = widthPx;
  localStorage.setItem(WBS_COLWIDTHS_KEY, JSON.stringify(stored));
}

// Install a drag handle on a header cell that resizes its column via the matching CSS var.
function attachColumnResizer(cellEl, col) {
  const handle = el("div", { class: "col-resize", title: `${col.label} 너비 조절` });
  handle.addEventListener("mousedown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX;
    const cs = getComputedStyle(document.documentElement);
    const startW = parseInt(cs.getPropertyValue(col.cssVar)) || col.default;
    document.body.setAttribute("data-col-resizing", col.key);

    const onMove = (ev) => {
      const next = Math.max(col.min, startW + (ev.clientX - startX));
      document.documentElement.style.setProperty(col.cssVar, next + "px");
      // If this column is pinned, downstream pinned columns' sticky-left depends on its width.
      if (colSelection.has(col.key)) recomputeStickyOffsets();
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      document.body.removeAttribute("data-col-resizing");
      const finalW = parseInt(getComputedStyle(document.documentElement).getPropertyValue(col.cssVar)) || col.default;
      saveColumnWidth(col.key, finalW);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });
  // Double-click to reset to default.
  handle.addEventListener("dblclick", (e) => {
    e.preventDefault();
    e.stopPropagation();
    document.documentElement.style.setProperty(col.cssVar, col.default + "px");
    saveColumnWidth(col.key, col.default);
  });
  cellEl.appendChild(handle);
}

// Column selection — header click pins that column to the left during horizontal scroll
// (CSS `position: sticky`), Shift+click toggles into a multi-set. Each pinned column's
// sticky-left offset = sum of widths of all previously-pinned columns (in natural order),
// so a non-contiguous pin like {A, C} pulls C up against A once the scroll has carried
// the unpinned B underneath. Selection lives in memory only.
const colSelection = new Set();

function currentColumnWidth(col) {
  const cs = getComputedStyle(document.documentElement);
  return parseInt(cs.getPropertyValue(col.cssVar)) || col.default;
}

function recomputeStickyOffsets() {
  const root = document.documentElement;
  let acc = 0;
  // Only visible columns occupy grid tracks, so a pinned column's sticky-left offset is
  // the running sum of *visible* columns to its left. A hidden/deleted column contributes
  // no width (and can't be pinned), so iterating visibleColumns() keeps the math right.
  for (const col of visibleColumns()) {
    const varName = `--sticky-left-${col.key}`;
    if (colSelection.has(col.key)) {
      root.style.setProperty(varName, acc + "px");
      acc += currentColumnWidth(col);
    } else {
      root.style.removeProperty(varName);
    }
  }
}

function applyColSelection() {
  recomputeStickyOffsets();
  const wbs = document.getElementById("wbs");
  if (!wbs) return;
  wbs.querySelectorAll("[data-col-key]").forEach(node => {
    node.classList.toggle("col-pinned", colSelection.has(node.dataset.colKey));
  });
}

function toggleColSelection(key, additive) {
  if (additive) {
    if (colSelection.has(key)) colSelection.delete(key);
    else colSelection.add(key);
  } else {
    const onlyThis = colSelection.size === 1 && colSelection.has(key);
    colSelection.clear();
    if (!onlyThis) colSelection.add(key);
  }
  applyColSelection();
}

function attachColumnSelector(cellEl, col) {
  cellEl.dataset.colKey = col.key;
  cellEl.addEventListener("click", (e) => {
    // Clicks that originated on the resize handle shouldn't toggle pinning.
    if (e.target.classList && e.target.classList.contains("col-resize")) return;
    toggleColSelection(col.key, e.shiftKey);
  });
}

// Row selection — click a task row to select it, Shift+click to toggle into a multi-set.
// State lives in memory only (not persisted); rows already carry data-task-id from
// renderTaskRow, so we just flip the `.row-selected` class without re-rendering.
const rowSelection = new Set();

function applyRowSelection() {
  const root = document.getElementById("wbs");
  if (!root) return;
  root.querySelectorAll(".task-row[data-task-id]").forEach(node => {
    node.classList.toggle("row-selected", rowSelection.has(node.dataset.taskId));
  });
}

function toggleRowSelection(id, additive) {
  if (additive) {
    if (rowSelection.has(id)) rowSelection.delete(id);
    else rowSelection.add(id);
  } else {
    const onlyThis = rowSelection.size === 1 && rowSelection.has(id);
    rowSelection.clear();
    if (!onlyThis) rowSelection.add(id);
  }
  applyRowSelection();
}

// Cells contain inputs/buttons users need to interact with normally. Treat clicks on those
// (and the row's own action buttons / disclosure toggle) as edits, not row selection.
const ROW_CLICK_PASSTHRU = "input, select, textarea, button, [contenteditable], .toggle, .col-resize, a";

function attachRowSelector(rowEl, taskId) {
  // mousedown — not click — because Shift+click would otherwise start a text selection
  // before our click handler runs. preventDefault on mousedown stops that, and we
  // also clear any range the browser had started building from a prior anchor.
  rowEl.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return; // left button only
    if (e.target.closest && e.target.closest(ROW_CLICK_PASSTHRU)) return;
    if (e.shiftKey) {
      e.preventDefault();
      const sel = window.getSelection();
      if (sel) sel.removeAllRanges();
    }
    toggleRowSelection(taskId, e.shiftKey);
  });
}

//============ Column visibility (hide / delete) ============
// Two per-project lists drive which data columns render:
//   • hiddenCols  — hidden from view, DATA PRESERVED. Restored via the "숨김 해제" menu.
//   • deletedCols — removed from view AND the field's data wiped on every task
//                   (spreadsheet-style delete). Recoverable only via undo.
// Both live in state.project so they persist (autosave + JSON export) and are captured
// by the undo snapshot. The "name" column is protected (task identity) and never enters
// either list. visibleColumns() is the single source of truth that drives the grid track
// list, the header cells, the body cells, and the sticky-pin offsets — keeping them in
// lockstep so the grid can never drift out of alignment.

// Normalize/repair a project's column lists (drops unknown or protected keys, de-dupes,
// and lets a deleted column win over a hidden one). Called on every load/import/undo.
function ensureColumnState(proj) {
  if (!proj) return proj;
  const valid = new Set(RESIZABLE_COLUMNS.map(c => c.key));
  const keep = k => valid.has(k) && !(colMeta(k) && colMeta(k).protected);
  const deleted = Array.isArray(proj.deletedCols) ? [...new Set(proj.deletedCols.filter(keep))] : [];
  const delSet = new Set(deleted);
  const hidden = Array.isArray(proj.hiddenCols)
    ? [...new Set(proj.hiddenCols.filter(k => keep(k) && !delSet.has(k)))] : [];
  proj.deletedCols = deleted;
  proj.hiddenCols = hidden;
  return proj;
}

function hiddenColSet()  { return new Set((state.project && state.project.hiddenCols)  || []); }
function deletedColSet() { return new Set((state.project && state.project.deletedCols) || []); }

function visibleColumns() {
  if (!state.project) return RESIZABLE_COLUMNS;
  const hidden = hiddenColSet(), deleted = deletedColSet();
  return RESIZABLE_COLUMNS.filter(c => !hidden.has(c.key) && !deleted.has(c.key));
}

// Rebuild the .grid-row track list (--grid-cols) from the visible columns + Gantt so a
// hidden/deleted column's track collapses instead of leaving an empty gap.
function applyGridColumns() {
  const tracks = visibleColumns().map(c => `var(${c.cssVar})`);
  tracks.push("var(--gantt-w, 1fr)");
  document.documentElement.style.setProperty("--grid-cols", tracks.join(" "));
}

// Drop pins for any column that's no longer visible (so a hidden/deleted column doesn't
// linger in the sticky-offset math). Returns true if the selection changed.
function reconcileColSelection() {
  const visible = new Set(visibleColumns().map(c => c.key));
  let changed = false;
  for (const k of [...colSelection]) {
    if (!visible.has(k)) { colSelection.delete(k); changed = true; }
  }
  return changed;
}

// The value a field is reset to when its column is deleted. Text → ""; progress → 0;
// status → "not-started" (the natural "no status" default — "" would break the pill and
// leave the Gantt bars colorless).
function clearValueForField(field) {
  if (field === "progress") return 0;
  if (field === "status")   return "not-started";
  return "";
}

function hideColumns(keys) {
  if (!state.project) return;
  const targets = keys.filter(k =>
    colMeta(k) && !colMeta(k).protected &&
    !state.project.hiddenCols.includes(k) && !state.project.deletedCols.includes(k));
  if (!targets.length) return;
  markBeforeChange();
  for (const k of targets) { state.project.hiddenCols.push(k); colSelection.delete(k); }
  flushHistory();
  emit(); saveSoon();
}

function unhideColumns(keys) {
  if (!state.project) return;
  const set = new Set(keys);
  const next = state.project.hiddenCols.filter(k => !set.has(k));
  if (next.length === state.project.hiddenCols.length) return;
  markBeforeChange();
  state.project.hiddenCols = next;
  flushHistory();
  emit(); saveSoon();
}

function deleteColumns(keys) {
  if (!state.project) return;
  const targets = keys.filter(k =>
    colMeta(k) && !colMeta(k).protected && !state.project.deletedCols.includes(k));
  if (!targets.length) return;
  markBeforeChange();
  const hideSet = new Set(state.project.hiddenCols);
  for (const k of targets) {
    const meta = colMeta(k);
    state.project.deletedCols.push(k);
    hideSet.delete(k);          // a deleted column leaves the hidden list
    colSelection.delete(k);
    const clearVal = clearValueForField(meta.field);
    for (const t of state.project.tasks) t[meta.field] = clearVal;
  }
  state.project.hiddenCols = [...hideSet];
  flushHistory();
  emit(); saveSoon();
}

//============ Undo / redo (app-wide snapshot history) ============
// Snapshot-based: each discrete mutation deep-clones state.project BEFORE changing it and
// pushes the clone onto `past`. Undo swaps current↔past; redo swaps current↔future. Column
// ops + task add/delete/edit all flow through here. Inline text/number edits are grouped
// into ONE undo step via markBeforeChange (captures the pre-edit clone on the first
// keystroke) + flushHistory (commits it on blur/Enter). See keydown wiring in init().
//
// NOTE (realtime collaboration): this snapshot model is single-user only. In a shared room an
// undo here would revert OTHER people's edits too, because each entry is a deep clone of the
// WHOLE project. The sync adapter therefore swaps undo/redo for a Y.UndoManager scoped to this
// client's own changes while a room is joined, and restores these on leave. If you change the
// shape of `history` or of undo()/redo()/markBeforeChange()/flushHistory()/updateUndoButtons(),
// check sync/adapters/k-wbs.js — see docs/realtime-local-dev.md in the aiotool repo.
const HISTORY_LIMIT = 200;
const history = { past: [], future: [], pendingBase: null };

function cloneProject() { return JSON.parse(JSON.stringify(state.project)); }

// Capture the pre-change snapshot if one isn't already pending. Safe to call repeatedly
// inside a single logical edit (only the first call snapshots).
function markBeforeChange() {
  if (state.project && history.pendingBase == null) history.pendingBase = cloneProject();
}

// Commit the pending snapshot as one undo step and clear the redo stack.
function flushHistory() {
  if (history.pendingBase == null) return;
  history.past.push(history.pendingBase);
  if (history.past.length > HISTORY_LIMIT) history.past.shift();
  history.pendingBase = null;
  history.future.length = 0;
  updateUndoButtons();
}

function resetHistory() {
  history.past.length = 0;
  history.future.length = 0;
  history.pendingBase = null;
  updateUndoButtons();
}

function updateUndoButtons() {
  const u = $("#btnUndo"), r = $("#btnRedo");
  if (u) u.disabled = !(history.past.length || history.pendingBase);
  if (r) r.disabled = !history.future.length;
}

function undo() {
  flushHistory();                  // fold any in-progress edit group into `past` first
  if (!history.past.length) return;
  history.future.push(cloneProject());
  state.project = ensureColumnState(history.past.pop());
  reconcileColSelection();
  emit(); saveSoon(); updateUndoButtons();
}

function redo() {
  if (!history.future.length) return;
  history.past.push(cloneProject());
  state.project = ensureColumnState(history.future.pop());
  reconcileColSelection();
  emit(); saveSoon(); updateUndoButtons();
}

//============ Column header context menu ============
let colMenuEl = null;

function closeColMenu() {
  if (colMenuEl) { colMenuEl.remove(); colMenuEl = null; }
  document.removeEventListener("mousedown", onColMenuOutside, true);
  document.removeEventListener("keydown", onColMenuKey, true);
  window.removeEventListener("blur", closeColMenu);
  window.removeEventListener("resize", closeColMenu);
  const wbs = $("#wbs"); if (wbs) wbs.removeEventListener("scroll", closeColMenu, true);
}
function onColMenuOutside(e) { if (colMenuEl && !colMenuEl.contains(e.target)) closeColMenu(); }
function onColMenuKey(e) { if (e.key === "Escape") { e.stopPropagation(); closeColMenu(); } }

function colMenuItem(label, { icon = "", disabled = false, danger = false, onClick } = {}) {
  return el("button", {
    type: "button",
    class: "col-menu-item" + (danger ? " danger" : ""),
    role: "menuitem",
    disabled: disabled ? "" : null,
    onclick: disabled ? null : onClick,
  }, [icon ? el("span", { class: "mi-ico" }, [icon]) : null, label]);
}

//============ Column freeze (틀 고정) ============
// Freeze the leading block of columns up to AND INCLUDING the chosen column so it stays
// fixed on the left while the rest scroll horizontally. Reuses the existing pin machinery
// (colSelection + position:sticky + recomputeStickyOffsets), so "여기까지 고정" is simply
// "pin every visible column from the first through this one." In-memory only — a view
// preference, like the click-to-pin it builds on (not persisted, not in undo history).
function freezeUpToColumn(col) {
  const vis = visibleColumns();
  const idx = vis.findIndex(c => c.key === col.key);
  if (idx < 0) return;
  colSelection.clear();
  for (let i = 0; i <= idx; i++) colSelection.add(vis[i].key);
  applyColSelection();
}
function clearFreeze() {
  if (!colSelection.size) return;
  colSelection.clear();
  applyColSelection();
}

function openColumnMenu(col, x, y) {
  closeColMenu();
  // Commit any in-progress inline edit so the column op is its own undo step.
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches("input, textarea, select")) ae.blur();

  // Act on the whole pin-selection when the right-clicked column is part of a multi-set;
  // otherwise just the clicked column. Protected columns (name) are filtered from actions.
  const targetKeys = (colSelection.has(col.key) && colSelection.size > 1)
    ? RESIZABLE_COLUMNS.filter(c => colSelection.has(c.key)).map(c => c.key)
    : [col.key];
  const actionable = targetKeys.filter(k => !colMeta(k).protected);
  const labelOf = k => colMeta(k).label;
  const titleText = targetKeys.length > 1 ? `${targetKeys.length}개 컬럼 선택됨` : labelOf(targetKeys[0]);
  const countSuffix = actionable.length > 1 ? ` (${actionable.length}개)` : "";

  const menu = el("div", { class: "col-menu", role: "menu" });
  menu.appendChild(el("div", { class: "col-menu-title" }, [titleText]));

  menu.appendChild(colMenuItem("숨김" + countSuffix, {
    icon: "🙈",
    disabled: actionable.length === 0,
    onClick: () => { closeColMenu(); hideColumns(actionable); },
  }));
  menu.appendChild(colMenuItem("삭제" + countSuffix, {
    icon: "🗑",
    danger: true,
    disabled: actionable.length === 0,
    onClick: () => {
      closeColMenu();
      const names = actionable.map(labelOf).join(", ");
      const msg = `'${names}' 컬럼${actionable.length > 1 ? ` ${actionable.length}개` : ""}을(를) 삭제하면 모든 업무의 해당 데이터가 비워집니다.\n계속할까요? (실행취소로 되돌릴 수 있습니다)`;
      if (confirm(msg)) deleteColumns(actionable);
    },
  }));

  // Freeze (틀 고정) — keep the leading columns up to & including the right-clicked column
  // fixed on the left while the rest scroll right. Available on every column (incl. 업무명),
  // and always targets the clicked column even inside a multi-selection.
  menu.appendChild(el("div", { class: "col-menu-sep" }));
  menu.appendChild(colMenuItem(`여기까지 고정 (${labelOf(col.key)})`, {
    icon: "📌",
    onClick: () => { closeColMenu(); freezeUpToColumn(col); },
  }));
  if (colSelection.size) {
    menu.appendChild(colMenuItem("고정 해제", {
      icon: "📍",
      onClick: () => { closeColMenu(); clearFreeze(); },
    }));
  }

  const hidden = (state.project && state.project.hiddenCols) || [];
  if (hidden.length) {
    menu.appendChild(el("div", { class: "col-menu-sep" }));
    menu.appendChild(el("div", { class: "col-menu-label" }, ["숨김 해제"]));
    for (const k of hidden) {
      menu.appendChild(colMenuItem(labelOf(k), {
        icon: "↩",
        onClick: () => { closeColMenu(); unhideColumns([k]); },
      }));
    }
    if (hidden.length > 1) {
      menu.appendChild(colMenuItem("전체 숨김취소", {
        icon: "↩",
        onClick: () => { closeColMenu(); unhideColumns([...hidden]); },
      }));
    }
  }

  document.body.appendChild(menu);
  colMenuEl = menu;
  // Position at the cursor, clamped to the viewport.
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth  - r.width  - 8)) + "px";
  menu.style.top  = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + "px";

  // Defer wiring the dismiss listeners one tick so the opening event doesn't close it.
  setTimeout(() => {
    document.addEventListener("mousedown", onColMenuOutside, true);
    document.addEventListener("keydown", onColMenuKey, true);
    window.addEventListener("blur", closeColMenu);
    window.addEventListener("resize", closeColMenu);
    const wbs = $("#wbs"); if (wbs) wbs.addEventListener("scroll", closeColMenu, true);
  }, 0);
}

function attachColumnMenu(cellEl, col) {
  cellEl.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    openColumnMenu(col, e.clientX, e.clientY);
  });
}

const SCHEMA_VERSION = "0.1";
const STATUS_OPTIONS = [
  { value: "not-started", label: "대기" },
  { value: "in-progress", label: "진행중" },
  { value: "completed",   label: "완료" },
  { value: "blocked",     label: "차단" },
  { value: "on-hold",     label: "보류" },
];
const STATUS_LABEL = Object.fromEntries(STATUS_OPTIONS.map(s => [s.value, s.label]));
const STATUS_VALUE_BY_LABEL = Object.fromEntries(STATUS_OPTIONS.map(s => [s.label, s.value]));

// Canonical Excel column order — drives both export AND import validation.
// A sheet is considered "WBS-format" if its header row contains all of these column names.
const EXCEL_HEADERS = ["Level", "WBS", "RFP No.", "담당자", "산출물", "상태", "진행률", "시작일", "완료일"];

//============ State ============
const state = {
  project: null,
  view: "wbs",          // "wbs" | "report" — ephemeral UI state, not persisted
  filter: { assignee: "", status: "all" }, // assignee + status filters — ephemeral UI state, not persisted
  listeners: new Set(),
  // True when the current project has edits not yet exported to a FILE (.json/.xlsx).
  // localStorage autosave keeps the browser copy fresh, but "새로 만들기"/Import overwrite
  // that single copy — so anything not written to a file is the only thing truly at risk.
  // Set on every mutation (saveSoon), cleared on a successful file export.
  dirty: false,
};

function emit() { state.listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); }
function subscribe(fn) { state.listeners.add(fn); return () => state.listeners.delete(fn); }

let saveTimer = null;
// quiet=true persists without touching the visible "saving…/saved" status — used
// while an inline field is being typed so the status doesn't flash on every keystroke.
function saveSoon(quiet = false) {
  state.dirty = true; // any mutation = unsaved-to-file work (see state.dirty note)
  if (!quiet) $("#saveStatus").textContent = "saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.project));
    if (!quiet) {
      $("#saveStatus").textContent = "saved";
      setTimeout(() => { if ($("#saveStatus").textContent === "saved") $("#saveStatus").textContent = ""; }, 1200);
    }
  }, 400);
}

function loadProject() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try {
    const proj = JSON.parse(raw);
    if (proj && Array.isArray(proj.tasks)) normalizeHierarchy(proj.tasks);
    ensureColumnState(proj);   // backfill hiddenCols/deletedCols for older saves
    return proj;
  } catch { return null; }
}

// Repair task.parent_id for orphans created by older imports — for each task with
// level > 1, ensure its parent_id points at an existing ancestor task. If it doesn't
// (null, missing, or out-of-tree), re-link to the most recent earlier task at any
// lower level. This lets parent-status rollup (effectiveStatus) work on legacy data.
// Mutates `tasks` in place.
function normalizeHierarchy(tasks) {
  const idSet = new Set(tasks.map(t => t.id));
  const lastAtLevel = {};
  let repaired = 0;
  for (const t of tasks) {
    const lv = Number.isFinite(t.level) ? t.level : 1;
    const needsRepair = lv > 1 && (t.parent_id == null || !idSet.has(t.parent_id));
    if (needsRepair) {
      let newParent = null;
      for (let k = lv - 1; k >= 1; k--) {
        if (lastAtLevel[k]) { newParent = lastAtLevel[k]; break; }
      }
      if (newParent !== t.parent_id) { t.parent_id = newParent; repaired++; }
    }
    lastAtLevel[lv] = t.id;
    for (let k = lv + 1; k <= 4; k++) delete lastAtLevel[k];
  }
  if (repaired) console.info(`[k-wbs] normalized ${repaired} orphan task(s) — parent_id was missing or invalid`);
}

function newProject(name) {
  return {
    version: SCHEMA_VERSION,
    name: name || "새 프로젝트",
    tasks: [],
    hiddenCols: [],   // columns hidden from view (data preserved) — see column visibility
    deletedCols: [],  // columns removed + data wiped (spreadsheet-style delete)
  };
}

//============ Task helpers ============
function genId() { return "t-" + Math.random().toString(36).slice(2, 9); }

function findTask(id) {
  return state.project.tasks.find(t => t.id === id);
}

function childrenOf(parentId) {
  return state.project.tasks.filter(t => t.parent_id === parentId);
}

function descendantsOf(id) {
  const out = [];
  const stack = [id];
  while (stack.length) {
    const pid = stack.pop();
    for (const t of state.project.tasks) {
      if (t.parent_id === pid) { out.push(t); stack.push(t.id); }
    }
  }
  return out;
}

function hasChildren(id) {
  return state.project.tasks.some(t => t.parent_id === id);
}

// Effective status — leaves use their own user-set value; parents are auto-summarised
// from ALL descendants (leaves + intermediates) + self by priority:
//   1) every leaf-descendant completed   → completed
//   2) any descendant in-progress        → in-progress   (catches intermediate L2/L3
//                                                         marked active even if their
//                                                         own deeper leaves haven't been
//                                                         touched yet)
//   3) any descendant blocked            → blocked
//   4) any descendant on-hold            → on-hold
//   5) MIXED: some completed but not all → in-progress   (work has started under this
//                                                         parent, so it's no longer 대기)
//   6) otherwise                         → not-started
// Status pills + gantt bar color + filters + stats all read this so the rollup is
// consistent across the WBS, Report, and the toolbar count buttons.
function effectiveStatus(t) {
  if (!hasChildren(t.id)) return t.status;
  const desc = descendantsOf(t.id);
  if (!desc.length) return t.status;
  // "All completed" still measured against leaves only — intermediates' stored status
  // isn't authoritative for completion, since their children might still be open.
  const leaves = desc.filter(d => !hasChildren(d.id));
  if (leaves.length && leaves.every(d => d.status === "completed")) return "completed";
  // Activity signals propagate from anywhere in the subtree INCLUDING SELF — so an
  // intermediate node that's explicitly marked active reads as active itself, not just
  // its ancestors. Without including self, B-L3 (stored=in-progress) would show as
  // not-started while its parents B-L2/B-L1 paradoxically showed in-progress.
  const someActive = (s) => t.status === s || desc.some(d => d.status === s);
  if (someActive("in-progress")) return "in-progress";
  if (someActive("blocked"))     return "blocked";
  if (someActive("on-hold"))     return "on-hold";
  // Mixed-progress fallthrough — if any leaf is completed (work has begun) but not all
  // are, the parent is "in-progress" rather than "not-started". User expectation: a
  // parent shouldn't read as 대기 when its children clearly have work done.
  if (someActive("completed")) return "in-progress";
  return "not-started";
}

function addTask(parentId, seed = {}) {
  const parent = parentId ? findTask(parentId) : null;
  const level = parent ? Math.min(4, parent.level + 1) : 1;
  const status = seed.status || "not-started";
  const task = {
    id: genId(),
    parent_id: parentId || null,
    level,
    name: seed.name || (parentId ? `${parent.name} - 하위 업무` : `Level 1 업무 ${(state.project.tasks.filter(t => !t.parent_id).length + 1)}`),
    rfp_no: seed.rfp_no || "",
    assignee: seed.assignee || "",
    deliverable: seed.deliverable || "",
    status,
    progress: seed.progress != null ? clampProgress(seed.progress) : progressForStatus(status, 0),
    start_date: seed.start_date || "",
    end_date: seed.end_date || "",
    expanded: true,
  };
  markBeforeChange();
  state.project.tasks.push(task);
  if (parent) parent.expanded = true;
  flushHistory();
  emit(); saveSoon();
  return task;
}

// Progress is 0-100 integer. Status drives whether it's editable AND its forced value:
//   not-started → 0    (frozen)
//   completed   → 100  (frozen)
//   in-progress → editable
//   blocked/on-hold → keep current value (frozen at whatever was achieved)
function clampProgress(v) {
  const n = parseInt(v);
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(100, n));
}
function progressForStatus(status, current) {
  if (status === "not-started") return 0;
  if (status === "completed")   return 100;
  return clampProgress(current);
}
function isProgressEditable(status) {
  return status === "in-progress";
}

function deleteTask(id) {
  const all = [id, ...descendantsOf(id).map(t => t.id)];
  const set = new Set(all);
  markBeforeChange();
  state.project.tasks = state.project.tasks.filter(t => !set.has(t.id));
  flushHistory();
  emit(); saveSoon();
}

function updateTask(id, patch) {
  const t = findTask(id);
  if (!t) return;
  markBeforeChange();   // no-op if an inline-edit group already captured the pre-edit snapshot
  Object.assign(t, patch);
  // If status changed, normalize progress: not-started → 0, completed → 100.
  // blocked/on-hold keep whatever value the task had (frozen mid-progress).
  if (patch.status !== undefined) {
    t.progress = progressForStatus(t.status, t.progress);
  }
  if (patch.progress !== undefined) {
    t.progress = clampProgress(t.progress);
  }
  flushHistory();
  emit(); saveSoon();
}

// Expand/collapse is view state — intentionally NOT recorded in undo history (undoing a
// collapse instead of your last real edit would be surprising).
function toggleExpanded(id) {
  const t = findTask(id);
  if (!t) return;
  t.expanded = !t.expanded;
  emit(); saveSoon();
}

// Update one task field in memory and persist quietly — NO emit(), so the focused
// input is NOT torn down by a re-render mid-typing. Inline text editors call this on
// every keystroke; the visible re-render + "saved" status are deferred to commit
// (blur / Enter / clicking elsewhere), where updateTask() runs in full.
function updateTaskField(id, key, value) {
  const t = findTask(id);
  if (!t) return;
  markBeforeChange();   // capture pre-edit snapshot on first keystroke; committed on blur/Enter
  t[key] = value;
  saveSoon(true);
}

// Split an assignee cell string into individual names. Supports the common Korean/English
// delimiters users actually type: comma (half/full-width), semicolon, slash, pipe,
// ampersand, middle-dot, Japanese enumeration comma, and newline.
function parseAssignees(s) {
  if (!s) return [];
  return s.split(/[,;\/|&·,、\n]+/).map(x => x.trim()).filter(Boolean);
}

// Substring match (case-insensitive) against any parsed name in the assignee cell.
// So filter "철수" matches a task whose assignee is "김철수, 이영희".
function matchesAssigneeFilter(t, q) {
  if (!q) return true;
  const ql = q.toLowerCase();
  return parseAssignees(t.assignee).some(name => name.toLowerCase().includes(ql));
}

// Test whether a single task matches the active status filter.
// `delayed` is a derived state covering both overdue and late-start (see delayInfo).
function matchesStatusFilter(t, statusFilter, today) {
  if (!statusFilter || statusFilter === "all") return true;
  if (statusFilter === "delayed") return !!delayInfo(t, today);
  return effectiveStatus(t) === statusFilter;
}

// Build the set of task ids to include when ANY filter is active: every directly-matching
// task plus all of its ancestors, so the matching rows remain reachable in the tree.
// Returns null when no filter is active (caller treats null = "show everything").
function computeFilterIncludeSet() {
  const q = (state.filter && state.filter.assignee) || "";
  const statusFilter = (state.filter && state.filter.status) || "all";
  if (!q && statusFilter === "all") return null;

  const today = todayUTC();
  const direct = new Set();
  for (const t of state.project.tasks) {
    if (q && !matchesAssigneeFilter(t, q)) continue;
    if (!matchesStatusFilter(t, statusFilter, today)) continue;
    direct.add(t.id);
  }
  if (!direct.size) return direct;
  const include = new Set(direct);
  for (const id of direct) {
    let cur = findTask(id);
    while (cur && cur.parent_id && !include.has(cur.parent_id)) {
      include.add(cur.parent_id);
      cur = findTask(cur.parent_id);
    }
  }
  return include;
}

// Visible task ordering: preorder traversal, respecting parent's expanded flag.
// When any filter is active, only included tasks are emitted and traversal descends
// regardless of `expanded` so matches aren't hidden under collapsed parents.
function visibleTasks() {
  const out = [];
  const includeSet = computeFilterIncludeSet();
  const walk = (parentId) => {
    const children = childrenOf(parentId);
    for (const t of children) {
      if (includeSet && !includeSet.has(t.id)) continue;
      out.push(t);
      if (includeSet || t.expanded !== false) walk(t.id);
    }
  };
  walk(null);
  return out;
}

//============ Date helpers ============
const MS_PER_DAY = 86400000;

function parseDate(s) {
  if (!s) return null;
  // expected YYYY-MM-DD
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return null;
  const d = new Date(Date.UTC(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])));
  return isNaN(d) ? null : d;
}
function fmtDateISO(d) {
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, "0");
  const day = String(d.getUTCDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtDateShort(d) {
  return `${d.getUTCMonth() + 1}.${d.getUTCDate()}`;
}
function dayDiff(a, b) { return Math.round((b - a) / MS_PER_DAY); }
function addDays(d, n) { return new Date(d.getTime() + n * MS_PER_DAY); }

function todayUTC() {
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}

// Compute effective date range: explicit on task, OR aggregated from descendants for parents.
// Returns { start, end, derived } where `derived` is true if either bound was
// rolled up from descendant tasks (parent summary). This flag drives the Gantt
// bar styling so users can tell user-set bars from auto-summary bars at a glance.
function taskDateRange(t) {
  const sOwn = parseDate(t.start_date);
  const eOwn = parseDate(t.end_date);
  if (sOwn && eOwn) return { start: sOwn, end: eOwn, derived: false };
  // Roll up: earliest descendant start, latest descendant end.
  const desc = descendantsOf(t.id);
  let ds = null, de = null;
  for (const d of desc) {
    const ps = parseDate(d.start_date);
    const pe = parseDate(d.end_date);
    if (ps && (!ds || ps < ds)) ds = ps;
    if (pe && (!de || pe > de)) de = pe;
  }
  const start = sOwn || ds;
  const end   = eOwn || de;
  const derived = (!sOwn && !!ds) || (!eOwn && !!de);
  return { start, end, derived };
}

// Classify a task as delayed against today. Two categories:
//   overdue    — end date has passed but the task isn't completed
//   late-start — start date has passed but the task is still "not-started"
// Tasks with status "completed" are never flagged. Parents with derived dates inherit
// the delay (their derived end is past iff at least one descendant's end is past).
function delayInfo(t, today) {
  const eff = effectiveStatus(t);
  if (eff === "completed") return null;
  const { start, end } = taskDateRange(t);
  if (end && end < today) {
    return { type: "overdue", days: dayDiff(end, today) };
  }
  if (start && start < today && eff === "not-started") {
    return { type: "late-start", days: dayDiff(start, today) };
  }
  return null;
}

// Raw earliest-start / latest-end across the given tasks — no padding, no defaults.
// Either bound may be null if no task in the set has that side of a date.
// This is the "real" project span used for workday counts (WBS stat, Report cards),
// so the numbers reflect actual planned work, not gantt visual breathing room.
function projectDateRangeRaw(tasks = state.project.tasks) {
  let min = null, max = null;
  for (const t of tasks) {
    const { start, end } = taskDateRange(t);
    if (start && (!min || start < min)) min = start;
    if (end   && (!max || end   > max)) max = end;
  }
  return { start: min, end: max };
}

// Gantt-visualization range: like the raw range but with a 60-day window fallback when
// no dates exist, missing-side defaults, and a few days of padding on each side so bars
// don't render flush against the axis edges.
function projectDateRange(tasks = state.project.tasks) {
  let { start: min, end: max } = projectDateRangeRaw(tasks);
  const today = todayUTC();
  if (!min && !max) {
    min = addDays(today, -7);
    max = addDays(today, 53);
  } else {
    if (!min) min = max ? addDays(max, -30) : today;
    if (!max) max = min ? addDays(min, 30) : addDays(today, 30);
    // Pad each side
    min = addDays(min, -3);
    max = addDays(max, 7);
  }
  return { start: min, end: max };
}

//============ DOM helpers ============
function $(sel) { return document.querySelector(sel); }
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null) continue;
      if (k === "class") node.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "dataset" && typeof v === "object") Object.assign(node.dataset, v);
      else node.setAttribute(k, v);
    }
  }
  if (children != null) {
    for (const c of [].concat(children)) {
      if (c == null || c === false) continue;
      node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
    }
  }
  return node;
}

// Inline text editor that commits on completion, not on every keystroke. While the
// user types, the model is updated quietly (persist only, no re-render) so the focused
// input survives. The visible re-render + "saved" status fire only when editing ends:
//   • blur (click/tap elsewhere) or Tab → native `change` event
//   • Enter → blur() → `change` event
// The Enter handler ignores `isComposing` so confirming a Hangul block with Enter does
// not prematurely commit. If a browser's IME quirk lets that Enter slip through, the
// blur path still commits cleanly — it's the reliable backstop, Enter is convenience.
function inlineTextInput(taskId, key, { class: className, value, placeholder }) {
  return el("input", {
    class: className,
    value: value,
    placeholder: placeholder,
    oninput: e => updateTaskField(taskId, key, e.target.value),
    onchange: e => updateTask(taskId, { [key]: e.target.value }),
    onkeydown: e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); e.target.blur(); } },
  });
}

//============ Render ============
function render() {
  $("#projectName").value = state.project.name;
  document.body.dataset.view = state.view;
  const reportBtn = $("#btnReport");
  if (reportBtn) reportBtn.textContent = state.view === "report" ? "← WBS" : "📊 Report";
  if (state.view === "report") {
    renderReport();
  } else {
    renderToolbar();
    renderWbs();
  }
}

function renderToolbar() {
  const tasks = state.project.tasks;
  const q = (state.filter && state.filter.assignee) || "";
  // Stat counts are measured against LEAF tasks only — parents' derived statuses
  // would otherwise double-count their already-counted children (e.g., a 完了 L2
  // whose only leaf is also 完了 would show 2 in 완료). Leaves are the unit of work,
  // so counting them gives an accurate "X of Y tasks done" reading.
  // Assignee filter (when set) is applied on the same leaf subset.
  const isLeafTask = (t) => !hasChildren(t.id);
  const leafTasksAll = tasks.filter(isLeafTask);
  const statTasks = q ? leafTasksAll.filter(t => matchesAssigneeFilter(t, q)) : leafTasksAll;

  $("#statCount").textContent = statTasks.length;
  $("#statDone").textContent = statTasks.filter(t => t.status === "completed").length;
  $("#statInProg").textContent = statTasks.filter(t => t.status === "in-progress").length;

  // 지연 stat — leaf-only. Hidden when zero so it doesn't add noise to a healthy project.
  const today = todayUTC();
  const delayedRows = statTasks.filter(t => delayInfo(t, today)).length;
  $("#statDelayedV").textContent = delayedRows;
  $("#statDelayed").style.display = delayedRows ? "" : "none";

  // Reflect the active status filter on the corresponding .stat-btn.
  const activeStatus = (state.filter && state.filter.status) || "all";
  document.querySelectorAll(".toolbar .stat-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.statusFilter === activeStatus);
  });

  // Date range — same subset. Uses the raw (un-padded) project span so the displayed
  // date pair and 영업일 count reflect the actual planned work, and so the Report view's
  // "총 투입일" can derive an identical value from the same formula.
  if (statTasks.some(t => t.start_date || t.end_date)) {
    const { start, end } = projectDateRangeRaw(statTasks);
    const wd = (start && end) ? countWorkdays(start, end) : 0;
    $("#statDateRangeV").textContent = `${fmtDateShort(start)} ~ ${fmtDateShort(end)} (${wd} 영업일)`;
    $("#statDateRange").style.display = "";
  } else {
    $("#statDateRange").style.display = "none";
  }

  // Assignee filter chip — count shows direct matches / total. Don't overwrite the input
  // value while user is actively typing (would race the cursor).
  const wrap = $("#assigneeFilterWrap");
  const inp = $("#assigneeFilter");
  const cnt = $("#assigneeFilterCount");
  if (wrap) wrap.classList.toggle("has-value", !!q);
  if (inp && document.activeElement !== inp) inp.value = q;
  if (cnt) cnt.textContent = q ? `${statTasks.length}/${leafTasksAll.length}` : "";
}

function renderWbs() {
  const root = $("#wbs");
  root.innerHTML = "";
  applyGridColumns();   // keep the grid track list in sync with hidden/deleted columns
  const tasks = state.project.tasks;
  if (!tasks.length) {
    root.appendChild(el("div", { class: "empty" }, [
      el("div", { class: "icon" }, ["▦"]),
      el("h2", {}, ["프로젝트가 비어 있습니다"]),
      el("p", {}, ["상단의 '＋ Level 1 업무' 버튼으로 최상위 업무를 추가하세요. 각 행에서 ＋를 눌러 Level 2~4의 하위 업무를 추가할 수 있습니다."]),
      el("button", {
        class: "top-btn primary",
        onclick: () => addTask(null),
      }, ["＋ 첫 업무 추가"]),
    ]));
    return;
  }

  const { start: rangeStart, end: rangeEnd } = projectDateRange();
  const totalDays = dayDiff(rangeStart, rangeEnd);
  const dayW = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--day-w")) || 18;
  const ganttW = Math.max(totalDays * dayW, 600);
  // Publish the gantt column width to CSS so .grid-row's last column expands to it
  // (otherwise `1fr` clamps the timeline to whatever space the viewport leaves over
  // and only the first few days of the axis would be visible).
  document.documentElement.style.setProperty("--gantt-w", ganttW + "px");
  // Align the weekend-shading CSS pattern (in .gantt-cell::after) so its 2-day shaded
  // segment lands on Sat/Sun for the current rangeStart. Pattern is Mon-rooted, so
  // shift the background-position left by the number of days since the most recent Monday.
  const dowMon = (rangeStart.getUTCDay() + 6) % 7; // Mon=0, Tue=1, ..., Sun=6
  document.documentElement.style.setProperty("--weekend-offset", (-dowMon * dayW) + "px");

  // Header row — each visible data column gets a click-to-pin selector, a resize handle,
  // and a right-click context menu (숨김/삭제/숨김 해제). Gantt column gets none.
  const headerCells = visibleColumns().map(col => {
    const cell = el("div", { class: "cell" }, [col.label]);
    attachColumnSelector(cell, col);
    attachColumnResizer(cell, col);
    attachColumnMenu(cell, col);
    return cell;
  });
  const headerRow = el("div", { class: "grid-row header-row" }, [
    ...headerCells,
    el("div", { class: "gantt-axis-cell" }, [renderGanttAxis(rangeStart, rangeEnd, dayW, ganttW)]),
  ]);
  root.appendChild(headerRow);

  // Body rows
  const list = visibleTasks();
  const today = todayUTC();
  const todayOffset = (today >= rangeStart && today <= rangeEnd) ? dayDiff(rangeStart, today) * dayW : null;
  // Pre-compute holiday positions (in px) once for the visible gantt span so each row's
  // strip rendering is just an iteration over a small array, not a per-day lookup.
  const visibleDays = Math.floor(ganttW / dayW);
  const holidayPositions = [];
  for (let i = 0; i < visibleDays; i++) {
    const d = addDays(rangeStart, i);
    if (holidayState.set.has(fmtDateISO(d))) holidayPositions.push(i * dayW);
  }
  for (const t of list) {
    root.appendChild(renderTaskRow(t, rangeStart, dayW, ganttW, todayOffset, holidayPositions));
  }
  if (!list.length && state.filter.assignee) {
    root.appendChild(el("div", { class: "empty-filter" }, [
      `담당자 "${state.filter.assignee}"에 일치하는 업무가 없습니다`,
    ]));
  }

  // Footer "add level 1"
  const footer = el("div", {
    class: "grid-row",
    style: { borderBottom: "none", background: "transparent" },
  }, [
    el("div", { class: "cell", style: { gridColumn: "1 / -1", padding: "10px", color: "var(--text3)", fontSize: "11px" } }, [
      el("button", {
        class: "top-btn",
        onclick: () => addTask(null),
        style: { padding: "4px 12px", fontSize: "11px" },
      }, ["＋ Level 1 업무 추가"]),
    ]),
  ]);
  root.appendChild(footer);

  // Re-apply row + column selection to the freshly built DOM.
  applyRowSelection();
  applyColSelection();
}

function renderGanttAxis(start, end, dayW, ganttW) {
  const wrap = el("div", { class: "gantt-axis", style: { width: ganttW + "px" } });
  // Month strip
  let cur = new Date(start.getTime());
  while (cur < end) {
    const monthStart = cur;
    const nextMonth = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + 1, 1));
    const segEnd = nextMonth < end ? nextMonth : end;
    const left = dayDiff(start, monthStart) * dayW;
    const width = dayDiff(monthStart, segEnd) * dayW;
    wrap.appendChild(el("div", {
      class: "gantt-axis-month",
      style: { left: left + "px", width: width + "px" },
    }, [`${monthStart.getUTCFullYear()}.${String(monthStart.getUTCMonth() + 1).padStart(2, "0")}`]));
    cur = nextMonth;
  }
  // Day strip (only when zoom is wide enough)
  const showDayNum = dayW >= 16;
  const today = todayUTC();
  for (let i = 0; i < dayDiff(start, end); i++) {
    const d = addDays(start, i);
    const dow = d.getUTCDay(); // 0=Sun
    const isWeekend = dow === 0 || dow === 6;
    const isHoliday = holidayState.set.has(fmtDateISO(d));
    const isToday = d.getTime() === today.getTime();
    const klass = ["gantt-axis-day"];
    if (isWeekend) klass.push("weekend");
    if (isHoliday) klass.push("holiday");
    if (isToday) klass.push("today");
    wrap.appendChild(el("div", {
      class: klass.join(" "),
      style: { left: (i * dayW) + "px" },
    }, [showDayNum ? String(d.getUTCDate()) : ""]));
  }
  return wrap;
}

function renderTaskRow(t, rangeStart, dayW, ganttW, todayOffset, holidayPositions = []) {
  const hasChildrenFlag = hasChildren(t.id);
  const { start, end, derived } = taskDateRange(t);
  const delay = delayInfo(t, todayUTC());

  const indent = (t.level - 1) * 16;

  // Name cell with toggle, level badge, name input, action buttons
  const toggle = el("span", {
    class: "toggle" + (hasChildrenFlag ? "" : " leaf"),
    onclick: () => toggleExpanded(t.id),
  }, [hasChildrenFlag ? (t.expanded === false ? "▶" : "▼") : "•"]);

  const nameInput = inlineTextInput(t.id, "name", {
    class: "name-input",
    value: t.name,
    placeholder: `Level ${t.level} 업무`,
  });

  const actions = el("span", { class: "row-actions" }, [
    t.level < 4 ? el("button", {
      class: "row-btn",
      title: `Level ${t.level + 1} 하위 업무 추가`,
      onclick: () => addTask(t.id),
    }, ["＋"]) : null,
    el("button", {
      class: "row-btn",
      title: "같은 레벨 형제 업무 추가",
      onclick: () => addTask(t.parent_id),
    }, ["⤓"]),
    el("button", {
      class: "row-btn danger",
      title: "삭제",
      onclick: () => {
        const desc = descendantsOf(t.id);
        const cnt = desc.length;
        if (cnt > 0 && !confirm(`'${t.name}'과 하위 업무 ${cnt}개를 삭제할까요?`)) return;
        if (cnt === 0 && t.name && !confirm(`'${t.name}'을 삭제할까요?`)) return;
        deleteTask(t.id);
      },
    }, ["×"]),
  ]);

  const nameCell = el("div", {
    class: "cell name-cell",
    dataset: { colKey: "name" },
    style: { paddingLeft: (10 + indent) + "px" },
  }, [
    toggle,
    el("span", { class: `lv-badge lv-${t.level}` }, [`L${t.level}`]),
    delay ? el("span", {
      class: "delay-badge " + delay.type,
      title: delay.type === "overdue"
        ? `완료일이 ${delay.days}일 경과 — 상태: ${STATUS_LABEL[t.status] || t.status}`
        : `시작일이 ${delay.days}일 경과 — 아직 시작 안 함`,
    }, [delay.type === "overdue" ? `+${delay.days}일` : `시작 +${delay.days}일`]) : null,
    nameInput,
    actions,
  ]);

  // RFP cell
  const rfpCell = el("div", { class: "cell", dataset: { colKey: "rfp" } }, [
    inlineTextInput(t.id, "rfp_no", { class: "text-input rfp", value: t.rfp_no, placeholder: "—" }),
  ]);

  // Assignee cell
  const assigneeCell = el("div", { class: "cell", dataset: { colKey: "assignee" } }, [
    inlineTextInput(t.id, "assignee", { class: "text-input", value: t.assignee, placeholder: "—" }),
  ]);

  // Deliverable cell
  const delivCell = el("div", { class: "cell", dataset: { colKey: "deliv" } }, [
    inlineTextInput(t.id, "deliverable", { class: "text-input", value: t.deliverable, placeholder: "—" }),
  ]);

  // Status cell — leaves are editable; parents show a derived status auto-summarised
  // from their leaf descendants (read-only, italic to flag the "auto" nature).
  const effStatus = effectiveStatus(t);
  const isLeafTask = !hasChildrenFlag;
  const statusSelect = el("select", {
    class: "status-select status-pill " + effStatus + (isLeafTask ? "" : " derived-status"),
    disabled: isLeafTask ? null : "",
    title: isLeafTask ? "" : "하위 일정 기준 자동 집계",
    onchange: e => updateTask(t.id, { status: e.target.value }),
  }, STATUS_OPTIONS.map(s =>
    el("option", { value: s.value, selected: s.value === effStatus ? "" : null }, [s.label])));
  const statusCell = el("div", { class: "cell", dataset: { colKey: "status" } }, [statusSelect]);

  // Progress cell. Editable only while in-progress; not-started/completed are auto-locked
  // to 0/100, and blocked/on-hold freeze whatever value was reached. The cell has a thin
  // bar background under the input that fills proportionally for quick visual scanning.
  // Parents derive their progress from leaf descendants (effectiveProgress), and the input is
  // locked — editing it would be confusing since the value would be overwritten on next render.
  const progressVal = effectiveProgress(t);
  const progressEditable = !hasChildrenFlag && isProgressEditable(t.status);
  const progressCell = el("div", { class: "cell progress-cell", dataset: { colKey: "progress" } }, [
    el("div", { class: "progress-track" }, [
      el("div", {
        class: "progress-fill-bar status-" + effStatus,
        style: { width: progressVal + "%" },
      }),
    ]),
    el("input", {
      class: "progress-input" + (progressEditable ? "" : " locked"),
      type: "number", min: "0", max: "100", step: "5",
      value: progressVal,
      readOnly: progressEditable ? null : "",
      title: progressEditable
        ? "0–100 사이 정수. 5 단위 휠 조절 또는 직접 입력"
        : hasChildrenFlag           ? "하위 작업들의 진행률 평균 — 자동 집계 (직접 수정 불가)"
        : t.status === "completed"  ? "완료 상태 — 100% 고정 (상태를 '진행중'으로 바꾸면 수정 가능)"
        : t.status === "not-started" ? "시작 전 — 0% 고정 (상태를 '진행중'으로 바꾸면 수정 가능)"
        : "현재 상태에서는 진행률 직접 수정 불가",
      // Update the model quietly while typing (no re-render → input keeps focus, so
      // multi-digit values can be typed) and slide the fill bar live. The single undo
      // step + full normalize/re-render happen on commit (onchange = blur/Enter).
      oninput: e => {
        if (!progressEditable) return;
        markBeforeChange();
        const v = clampProgress(e.target.value);
        t.progress = v;
        saveSoon(true);
        const fill = e.target.closest(".progress-cell") &&
                     e.target.closest(".progress-cell").querySelector(".progress-fill-bar");
        if (fill) fill.style.width = v + "%";
      },
      onchange: e => {
        if (!progressEditable) return;
        updateTask(t.id, { progress: clampProgress(e.target.value) });
      },
      onfocus: e => e.target.select(),
    }),
    el("span", { class: "progress-pct-suffix" }, ["%"]),
  ]);

  // Date cells. When the task has no own start/end but children provide a range,
  // surface the rolled-up value as a derived display in the input (italic / lighter
  // color) so users can read parent summary dates here too — not just in the Gantt.
  // Typing in the input overrides the derived value (calls updateTask with the new value).
  const derivedStart = !t.start_date && start ? fmtDateISO(start) : "";
  const derivedEnd   = !t.end_date   && end   ? fmtDateISO(end)   : "";
  const startCell = el("div", { class: "cell", dataset: { colKey: "start" } }, [
    el("input", {
      class: "date-input" + (derivedStart ? " derived-value" : ""),
      type: "date",
      value: t.start_date || derivedStart,
      title: derivedStart ? `하위 일정에서 자동 집계 (${derivedStart}) — 입력하면 직접 값으로 덮어씁니다` : "",
      onchange: e => updateTask(t.id, { start_date: e.target.value }),
    }),
  ]);
  const endCell = el("div", { class: "cell", dataset: { colKey: "end" } }, [
    el("input", {
      class: "date-input" + (derivedEnd ? " derived-value" : ""),
      type: "date",
      value: t.end_date || derivedEnd,
      title: derivedEnd ? `하위 일정에서 자동 집계 (${derivedEnd}) — 입력하면 직접 값으로 덮어씁니다` : "",
      onchange: e => updateTask(t.id, { end_date: e.target.value }),
    }),
  ]);

  // Gantt cell — bar
  const ganttCell = el("div", {
    class: "gantt-axis-cell gantt-cell",
    style: { width: ganttW + "px" },
  });
  // grid background
  ganttCell.appendChild(el("div", { class: "grid-bg" }));
  if (todayOffset != null) {
    ganttCell.appendChild(el("div", { class: "today-line", style: { left: todayOffset + "px" } }));
  }
  if (start && end && end >= start) {
    const left = dayDiff(rangeStart, start) * dayW;
    const width = Math.max(dayW, (dayDiff(start, end) + 1) * dayW);
    const klass = ["gantt-bar", effStatus, `lv-${t.level}`];
    if (t.level === 1) klass.push("level-1");
    if (derived)      klass.push("derived");
    if (delay)        klass.push("delayed", delay.type);
    const titleSuffix = (derived ? " · 하위 일정으로 자동 집계" : "")
      + (delay ? (delay.type === "overdue" ? ` · 완료일 ${delay.days}일 경과` : ` · 시작 ${delay.days}일 지연`) : "");
    const bar = el("div", {
      class: klass.join(" "),
      style: { left: left + "px", width: width + "px" },
      title: `${t.name} — ${t.start_date || "?"} ~ ${t.end_date || "?"} (${STATUS_LABEL[effStatus] || effStatus})${titleSuffix}`,
    }, [width > 60 ? t.name : ""]);
    ganttCell.appendChild(bar);
  } else if (start || end) {
    // Single-point marker
    const d = start || end;
    const left = dayDiff(rangeStart, d) * dayW;
    ganttCell.appendChild(el("div", {
      class: "gantt-bar " + effStatus + ` lv-${t.level}` + (derived ? " derived" : ""),
      style: { left: left + "px", width: dayW + "px" },
      title: `${t.name} — ${t.start_date || t.end_date} (${STATUS_LABEL[effStatus] || effStatus})${derived ? " · 하위 일정으로 자동 집계" : " · 시작/완료일 미완"}`,
    }));
  }

  // Holiday strips on top of bars (weekends use the cell's ::after gradient overlay).
  for (const x of holidayPositions) {
    ganttCell.appendChild(el("div", {
      class: "holiday-strip",
      style: { left: x + "px", width: dayW + "px" },
    }));
  }

  // Only append cells for columns that are visible, in the same order visibleColumns()
  // yields — so body cells line up exactly with the header cells and the --grid-cols track
  // list (all three driven by visibleColumns()).
  const cellByKey = {
    name: nameCell, rfp: rfpCell, assignee: assigneeCell, deliv: delivCell,
    status: statusCell, progress: progressCell, start: startCell, end: endCell,
  };
  const row = el("div", {
    class: "grid-row task-row level-" + t.level,
    dataset: { taskId: t.id },
  }, [...visibleColumns().map(c => cellByKey[c.key]), ganttCell]);
  attachRowSelector(row, t.id);

  return row;
}

//============ Report (aggregate view) ============
// Holiday set is loaded asynchronously from holidays-kr.json. Until it resolves the set is
// empty, which only affects workday counts — render is re-triggered via emit() on resolve.
const holidayState = { set: new Set(), loaded: false, error: null };

function loadHolidays() {
  return fetch("./holidays-kr.json")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(data => {
      holidayState.set = new Set(Object.keys(data.dates || {}));
      holidayState.loaded = true;
      emit();
    })
    .catch(err => {
      holidayState.error = err.message || String(err);
      // Leave set empty; report still works but workday math ignores holidays.
      console.warn("[k-wbs] 공휴일 JSON 로드 실패 (페이지가 file://로 열려있나요? http로 서빙하세요):", err);
      emit();
    });
}

function isWorkday(d) {
  const dow = d.getUTCDay();
  if (dow === 0 || dow === 6) return false;
  return !holidayState.set.has(fmtDateISO(d));
}

function countWorkdays(start, end) {
  if (!start || !end || end < start) return 0;
  let cnt = 0;
  for (let cur = new Date(start.getTime()); cur <= end; cur = addDays(cur, 1)) {
    if (isWorkday(cur)) cnt++;
  }
  return cnt;
}

function leafTasks() {
  const parents = new Set();
  for (const t of state.project.tasks) {
    if (t.parent_id) parents.add(t.parent_id);
  }
  return state.project.tasks.filter(t => !parents.has(t.id));
}

// Assumed progress: if a task is in-progress with 0% recorded, infer % from elapsed
// workdays vs total workdays in its date range. Otherwise use the status-normalized value.
function timeProgressPct(start, end, today) {
  if (!start || !end || end < start) return 0;
  if (today < start) return 0;
  if (today >= end) return 100;
  const total = countWorkdays(start, end);
  if (total === 0) return 0;
  const elapsed = countWorkdays(start, today);
  return Math.round(elapsed / total * 100);
}

// Canonical "what progress should this task display" — parents roll up from their leaf
// descendants (matching how `effectiveStatus` rolls up), leaves use their stored value with a
// time-based fallback when explicitly in-progress but the user hasn't recorded a number yet.
function effectiveProgress(t, today) {
  if (hasChildren(t.id)) {
    const desc = descendantsOf(t.id);
    const leaves = desc.filter(d => !hasChildren(d.id));
    if (!leaves.length) return progressForStatus(t.status, t.progress);
    const sum = leaves.reduce((acc, l) => acc + progressForStatus(l.status, l.progress), 0);
    return Math.round(sum / leaves.length);
  }
  if (t.status === "in-progress" && (t.progress || 0) === 0) {
    const { start, end } = taskDateRange(t);
    return timeProgressPct(start, end, today || todayUTC());
  }
  return progressForStatus(t.status, t.progress);
}

function computeReport() {
  const leaves = leafTasks();
  const today = todayUTC();
  let sumActual = 0;
  // Per-person: collect earliest-start / latest-end across each person's tasks so we can
  // compute their workdays as a single span (matches WBS's calculation — no double-counting
  // of overlapping task ranges).
  const byPerson = new Map();

  for (const t of leaves) {
    const actual = progressForStatus(t.status, t.progress);
    sumActual += actual;

    const { start, end } = taskDateRange(t);

    // Co-assignments like "이지현, 본사지원인원" split into individual people. Each
    // co-assignee gets the FULL date range of the shared task (no 1/N split) so workdays
    // reflect everyone-fully-engaged semantics.
    const taskDelay = delayInfo(t, today);
    const names = parseAssignees(t.assignee);
    const namesToAdd = names.length ? names : ["(미지정)"];
    for (const name of namesToAdd) {
      if (!byPerson.has(name)) byPerson.set(name, { count: 0, sumActual: 0, min: null, max: null, delayedCount: 0 });
      const p = byPerson.get(name);
      p.count++;
      p.sumActual += actual;
      if (taskDelay) p.delayedCount++;
      if (start && (!p.min || start < p.min)) p.min = start;
      if (end   && (!p.max || end   > p.max)) p.max = end;
    }
  }

  const n = leaves.length;
  // Project-level totals use the same single-span workday count as the WBS stat —
  // earliest start to latest end across ALL tasks (not just leaves so it matches WBS).
  const { start: projStart, end: projEnd } = projectDateRangeRaw();
  const totalWd = (projStart && projEnd) ? countWorkdays(projStart, projEnd) : 0;
  const actualAvg = n ? sumActual / n : 0;
  // Progress investment uses actual user-recorded progress (not the time-based
  // assumption) — user explicitly wants real numbers over estimates here.
  const progressedWd = Math.round(totalWd * actualAvg / 100);
  const delayedLeaves = leaves.filter(t => delayInfo(t, today));
  const overdueCount = delayedLeaves.filter(t => delayInfo(t, today).type === "overdue").length;
  const lateStartCount = delayedLeaves.length - overdueCount;

  return {
    leafCount: n,
    overall: n ? Math.round(actualAvg) : 0,
    totalWorkdays: totalWd,
    progressedWorkdays: progressedWd,
    delayedCount: delayedLeaves.length,
    overdueCount,
    lateStartCount,
    byPerson: Array.from(byPerson.entries())
      .map(([name, p]) => {
        const wd = countWorkdays(p.min, p.max);
        const avg = p.count ? p.sumActual / p.count : 0;
        return {
          name,
          count: p.count,
          avgProgress: Math.round(avg),
          workdays: wd,
          progressedWd: Math.round(wd * avg / 100),
          delayedCount: p.delayedCount,
          delayedRate: p.count ? Math.round(p.delayedCount / p.count * 100) : 0,
        };
      })
      .sort((a, b) => b.workdays - a.workdays || a.name.localeCompare(b.name, "ko")),
  };
}

function pctBar(pct) {
  const safe = Math.max(0, Math.min(100, pct));
  return el("span", { class: "pct-bar" }, [el("i", { style: { width: safe + "%" } })]);
}

function renderReport() {
  const root = $("#wbs");
  root.innerHTML = "";

  const r = computeReport();
  const wrap = el("div", { class: "report-wrap" });

  if (r.leafCount === 0) {
    wrap.appendChild(el("div", { class: "empty" }, [
      el("div", { class: "icon" }, ["📊"]),

    ]));
    root.appendChild(wrap);
    return;
  }

  // ── Top cards ── (3-card layout — assumed-progress card was removed at user request;
  // every metric here is based on the user-recorded actual progress.)
  const cardOverall = el("div", { class: "report-card accent" }, [
    el("div", { class: "label" }, ["전체 진행률"]),
    el("div", { class: "value" }, [r.overall + "%"]),
    el("div", { class: "sub" }, [`Leaf 업무 ${r.leafCount}개 평균 (실측값)`]),
    el("div", { class: "bar" }, [el("i", { style: { width: r.overall + "%" } })]),
  ]);
  const wdPct = r.totalWorkdays ? Math.round(r.progressedWorkdays / r.totalWorkdays * 100) : 0;
  const cardWd = el("div", { class: "report-card" }, [
    el("div", { class: "label" }, ["진행 투입일 / 총 투입일"]),
    el("div", { class: "value" }, [`${r.progressedWorkdays} / ${r.totalWorkdays}일`]),
    el("div", { class: "sub" }, ["주말·한국 공휴일 제외 · 실측 진행률 기반"]),
    el("div", { class: "bar" }, [el("i", { style: { width: wdPct + "%" } })]),
  ]);
  const delaySubParts = [];
  if (r.overdueCount)   delaySubParts.push(`완료일 경과 ${r.overdueCount}개`);
  if (r.lateStartCount) delaySubParts.push(`시작 지연 ${r.lateStartCount}개`);
  const cardDelay = el("div", { class: "report-card" + (r.delayedCount ? " danger" : "") }, [
    el("div", { class: "label" }, ["지연 업무"]),
    el("div", { class: "value" }, [`${r.delayedCount}개`]),
    el("div", { class: "sub" }, [delaySubParts.join(" · ") || "지연 없음"]),
  ]);
  wrap.appendChild(el("div", { class: "report-grid" }, [cardOverall, cardWd, cardDelay]));

  // ── Per-assignee table ──
  wrap.appendChild(el("h2", {}, ["인원별 진행률"]));
  const headRow = el("tr", {}, [
    el("th", {}, ["담당자"]),
    el("th", { class: "num" }, ["업무 수"]),
    el("th", { class: "num" }, ["투입일"]),
    el("th", { class: "num" }, ["진행 투입일"]),
    el("th", { class: "pct-cell" }, ["진행률"]),
    el("th", { class: "num" }, ["지연"]),
  ]);
  const bodyRows = r.byPerson.map(p => {
    const delayedCell = p.delayedCount
      ? el("td", { class: "num delay-cell" }, [`${p.delayedCount}개 · ${p.delayedRate}%`])
      : el("td", { class: "num" }, ["—"]);
    return el("tr", {}, [
      el("td", {}, [p.name]),
      el("td", { class: "num" }, [String(p.count)]),
      el("td", { class: "num" }, [`${p.workdays}일`]),
      el("td", { class: "num" }, [`${p.progressedWd}일`]),
      el("td", { class: "pct-cell" }, [pctBar(p.avgProgress), `${p.avgProgress}%`]),
      delayedCell,
    ]);
  });
  wrap.appendChild(el("table", { class: "report-table" }, [
    el("thead", {}, [headRow]),
    el("tbody", {}, bodyRows),
  ]));

  // ── Footnote on data state ──
  const noteParts = [];
  if (!holidayState.loaded && !holidayState.error) noteParts.push("공휴일 데이터 로딩 중…");
  if (holidayState.error) noteParts.push(`공휴일 JSON 로드 실패 (${holidayState.error}) — 주말만 제외하고 계산했습니다.`);
  if (noteParts.length) wrap.appendChild(el("div", { class: "report-note" }, [noteParts.join(" · ")]));

  root.appendChild(wrap);
}

//============ Import / Export ============
function safeFilename() {
  return (state.project.name || "wbs").replace(/[^\w가-힣.-]+/g, "_");
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportJson() {
  // Bundle the project + computed report so consumers (humans or downstream scripts) get
  // both the source data and the aggregated metrics in a single artifact.
  const payload = {
    ...state.project,
    report: computeReport(),
    exported_at: new Date().toISOString(),
  };
  const data = JSON.stringify(payload, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  triggerDownload(blob, `${safeFilename()}-wbs.json`);
  state.dirty = false; // current content now lives in a file
}

// Preorder traversal of all tasks (regardless of expanded state).
// Used for export: every row in the data, parents first.
function orderedTasks() {
  const out = [];
  const childrenByParent = new Map();
  for (const t of state.project.tasks) {
    const key = t.parent_id || "_root";
    if (!childrenByParent.has(key)) childrenByParent.set(key, []);
    childrenByParent.get(key).push(t);
  }
  const walk = (parentId) => {
    for (const t of (childrenByParent.get(parentId || "_root") || [])) {
      out.push(t);
      walk(t.id);
    }
  };
  walk(null);
  return out;
}

async function exportExcel() {
  let XLSX;
  $("#saveStatus").textContent = "엑셀 생성중…";
  try {
    XLSX = await import("https://esm.sh/xlsx@0.18.5");
  } catch (err) {
    console.error(err);
    $("#saveStatus").textContent = "";
    alert("Excel 라이브러리 로드 실패 (네트워크?).\nJSON 또는 CSV로 export하세요.\n\n" + err.message);
    return;
  }

  // Build rows in tree (preorder) so parent appears above its children.
  const tasks = orderedTasks();
  const rows = tasks.map(t => ({
    "Level":   t.level,
    "WBS":     "  ".repeat(t.level - 1) + (t.name || ""),
    "RFP No.": t.rfp_no || "",
    "담당자":   t.assignee || "",
    "산출물":   t.deliverable || "",
    "상태":     STATUS_LABEL[t.status] || t.status || "",
    "진행률":   effectiveProgress(t),
    "시작일":   t.start_date || "",
    "완료일":   t.end_date || "",
  }));

  const ws = XLSX.utils.json_to_sheet(rows, { header: EXCEL_HEADERS });
  // Column widths (in Excel char units)
  ws["!cols"] = [
    { wch: 6 },   // Level
    { wch: 42 },  // WBS (indented name)
    { wch: 14 },  // RFP No.
    { wch: 12 },  // 담당자
    { wch: 20 },  // 산출물
    { wch: 10 },  // 상태
    { wch: 8 },   // 진행률
    { wch: 12 },  // 시작일
    { wch: 12 },  // 완료일
  ];
  // Freeze header row
  ws["!freeze"] = { xSplit: 0, ySplit: 1 };

  const wb = XLSX.utils.book_new();
  const sheetName = (state.project.name || "WBS").slice(0, 31).replace(/[\[\]\*\/\\\?:]/g, "_");
  XLSX.utils.book_append_sheet(wb, ws, sheetName || "WBS");

  // Second sheet — Report summary (same data shown in the Report view).
  const r = computeReport();
  const summary = [
    ["전체 진행률 (%)",             r.overall],
    ["진행 투입일 / 총 투입일 (일)", `${r.progressedWorkdays} / ${r.totalWorkdays}`],
    ["지연 업무 (개)",              r.delayedCount],
    ["  · 완료일 경과 (개)",         r.overdueCount],
    ["  · 시작 지연 (개)",          r.lateStartCount],
    ["Leaf 업무 수",                r.leafCount],
  ];
  const reportRows = [
    ["프로젝트 요약"],
    ...summary,
    [],
    ["인원별"],
    ["담당자", "업무 수", "투입일", "진행 투입일", "진행률(%)", "지연 개수", "지연률(%)"],
    ...r.byPerson.map(p => [p.name, p.count, p.workdays, p.progressedWd, p.avgProgress, p.delayedCount, p.delayedRate]),
  ];
  const wsReport = XLSX.utils.aoa_to_sheet(reportRows);
  wsReport["!cols"] = [{ wch: 28 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, wsReport, "Report");

  const arr = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([arr], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  triggerDownload(blob, `${safeFilename()}-wbs.xlsx`);
  state.dirty = false; // current content now lives in a file
  $("#saveStatus").textContent = "엑셀 저장됨";
  setTimeout(() => { if ($("#saveStatus").textContent === "엑셀 저장됨") $("#saveStatus").textContent = ""; }, 1500);
}

// PDF export — build a printable HTML block (project name + summary cards + per-person
// table), inject into <body>, trigger window.print(), then clean up. Uses the browser's

  const personBody = r.byPerson.map(p => el2("tr", {}, [
    el2("td", {}, [p.name]),
    el2("td", { class: "num" }, [String(p.count)]),
    el2("td", { class: "num" }, [`${p.workdays}일`]),

    el2("thead", {}, [personHead]),
    el2("tbody", {}, personBody),

  setTimeout(cleanup, 60_000);
